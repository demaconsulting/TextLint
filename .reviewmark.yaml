# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following hierarchical scope principles.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "README.md"                   # Root README file
  - "requirements.yaml"           # Root requirements file
  - "**/*.cs"                     # All C# source and test files
  - "docs/reqstream/**/*.yaml"    # Requirements files
  - "docs/design/**/*.md"         # Design documentation files
  - "docs/verification/**/*.md"   # Verification documentation files
  - "docs/user_guide/**/*.md"     # User guide documentation
  - "docs/sysml2/**/*.sysml"      # SysML2 architecture model
  - "dictionaries/refresh.py"     # Word list import script (code that produces the builder's input data)
  - "dictionaries/word_forms.py"  # Hunspell expansion and spelling-region routing used by the import script
  - "dictionaries/README.md"      # Word list documentation: provenance, format rules, and refresh procedure
  - "dictionaries/technical/variant-keep.txt"   # Curated list of reviewed spelling variants (human-reviewed data)
  - "dictionaries/exclusions.txt"   # Curated list of words that must never be known (human-reviewed data)
  - "dictionaries/technical/general/additions.txt"   # Curated project-owned technical terms (human-reviewed data)
  - "test/DemaConsulting.TextLint.Tests/SpellChecking/Parity/**"   # cspell parity corpora and output (reviewed data)
  - "third-party/THIRD-PARTY-NOTICES.txt"   # Legal notices for the third-party word list data
  # Deliberately NOT listed: the generated English and technical word lists under dictionaries/en-*/ and
  # dictionaries/technical/ (other than the curated files above). They are generated data of about two hundred
  # thousand words that a reviewer cannot judge; the generator, its self-checks, the library tests, and the
  # curated lists above are reviewed instead (see dictionaries/README.md).
  - "!**/obj/**"                  # Exclude build output
  - "!**/bin/**"                  # Exclude build output
  - "!node_modules/**"            # Exclude npm dependencies
  - "!**/.venv/**"                # Exclude Python virtual environment

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/TextLint/reviews/index.json

# Context included for all reviews.
context:
  - docs/design/introduction.md

# Review sets following hierarchical scope principles.
# Each review-set focuses on a single compliance question with manageable file counts.
reviews:
  # Purpose
  - id: Purpose
    title: Review that README and User Guide are Coherent and Complete
    context:
      - "!docs/design/introduction.md"
    paths:
      - "README.md"
      - "docs/user_guide/**/*.md"

  # Decomposition Review (only one per repository)
  - id: Decomposition
    title: Review that TextLint Decomposition Addresses the Stated Purpose
    context:
      - README.md
      - "docs/user_guide/**/*.md"
    paths:
      - requirements.yaml
      - docs/reqstream/quality.yaml
      - docs/design/introduction.md
      - "docs/sysml2/**/*.sysml"

  # TextLint (library) - Specials
  - id: TextLint-Architecture
    title: Review that TextLint Architecture Satisfies Requirements
    context:
      - README.md
      - "docs/user_guide/**/*.md"
    paths:
      - "docs/reqstream/textlint.yaml"
      - "docs/design/introduction.md"
      - "docs/design/textlint.md"
      - "docs/verification/introduction.md"
