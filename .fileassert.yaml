  # --- PACKAGES ---
  #
  # These tests assert the shape of the DemaConsulting.TextLint library NuGet package the build
  # just produced, in the flat 'packages' folder written by build.yaml. Packing is a build
  # activity, so the real artifact is inspected here rather than re-packed from inside the
  # unit-test suite.
  #
  # ORDERING: the library package id is a prefix of the tool package id
  # (DemaConsulting.TextLint.Tool), and FileAssert globs have no way to exclude it, so
  # build.yaml runs these tests after packing only the library and before packing the tool.
  # 'count: 1' makes a violation loud: if the tool package were already present the pattern
  # would match two files and the test would fail rather than pass vacuously.

  - name: TextLint_Package_Packed_ContainsNet10Library
    description: "The library package ships the net10.0 assembly with its XML documentation"
    tags: [packages]
    files:
      - pattern: "packages/DemaConsulting.TextLint.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "lib/net10.0/DemaConsulting.TextLint.dll"
              min: 1
              max: 1
            - pattern: "lib/net10.0/DemaConsulting.TextLint.xml"
              min: 1
              max: 1
            # The library targets net10.0 only: the whole lib/ tree must hold exactly the two
            # files above, so any other assembly or target-framework folder fails the test.
            - pattern: "lib/**"
              min: 2
              max: 2
      # The symbols package is published alongside the library package.
      - pattern: "packages/DemaConsulting.TextLint.*.snupkg"
        count: 1

  - name: TextLint_Package_Packed_HasPackageMetadata
    description: "The library package is named DemaConsulting.TextLint and carries its publisher metadata"
    tags: [packages]
    files:
      - pattern: "packages/DemaConsulting.TextLint.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "DemaConsulting.TextLint.nuspec"
              min: 1
              max: 1
              text:
                - contains: "<id>DemaConsulting.TextLint</id>"
                - contains: "<authors>DEMA Consulting</authors>"
                - contains: '<license type="expression">MIT</license>'
                - contains: "<readme>README.md</readme>"
                - contains: "<icon>Icon.png</icon>"
                # The two runtime dependencies flow to consumers as package dependencies.
                - contains: '<dependency id="YamlDotNet"'
                - contains: '<dependency id="Microsoft.Extensions.FileSystemGlobbing"'
            - pattern: "README.md"
              min: 1
              max: 1
            - pattern: "Icon.png"
              min: 1
              max: 1

  # The library carries third-party word lists whose licenses require their notices to
  # accompany the data, so the notice file is at the package root. The assertion texts are
  # the author of the English word lists, the permission sentence of their license
  # (verbatim, on one line of the file), the publisher of the technical word lists, and the
  # author of the cspell-lib rules that the spell checker is derived from.
  - name: TextLint_Package_Packed_ContainsThirdPartyNotices
    description: "The library package carries the license notices of the embedded word lists"
    tags: [packages]
    files:
      - pattern: "packages/DemaConsulting.TextLint.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "THIRD-PARTY-NOTICES.txt"
              min: 1
              max: 1
              text:
                - contains: "Kevin Atkinson"
                - contains: "Permission to use, copy, modify, distribute, and sell any part of SCOWLv2"
                - contains: "Street Side Software"
                - contains: "Jason Dent"

  # The dictionaries are embedded in the library assembly, and the package is packed from the
  # build output without building again, so the packed assembly itself is inspected: the
  # manifest of an assembly lists each resource name as text.
  - name: TextLint_Package_Packed_ContainsEmbeddedDictionaries
    description: "The packed library assembly contains the four embedded dictionaries"
    tags: [packages]
    files:
      - pattern: "packages/DemaConsulting.TextLint.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "lib/net10.0/DemaConsulting.TextLint.dll"
              min: 1
              max: 1
              text:
                - contains: "DemaConsulting.TextLint.Dictionaries.en-common.tld"
                - contains: "DemaConsulting.TextLint.Dictionaries.en-US.tld"
                - contains: "DemaConsulting.TextLint.Dictionaries.en-GB.tld"
                - contains: "DemaConsulting.TextLint.Dictionaries.technical.tld"

  # --- TOOL PACKAGE ---
  #
  # These tests assert the shape of the DemaConsulting.TextLint.Tool package, which bundles
  # the library assembly and therefore the embedded word lists, so the license notices must
  # travel with it too. The tool package id is not a prefix of any other package id, so the
  # tests can run after both packages are packed; build.yaml runs them in their own step.

  - name: TextLintTool_Package_Packed_ContainsThirdPartyNotices
    description: "The tool package carries the license notices of the word lists in the bundled library"
    tags: [tool-package]
    files:
      - pattern: "packages/DemaConsulting.TextLint.Tool.*.nupkg"
        count: 1
        zip:
          files:
            - pattern: "THIRD-PARTY-NOTICES.txt"
              min: 1
              max: 1
              text:
                - contains: "Kevin Atkinson"
                - contains: "Permission to use, copy, modify, distribute, and sell any part of SCOWLv2"
                - contains: "Street Side Software"
                - contains: "Jason Dent"

  # --- LIBRARY PROJECT ---
  #
  # Asserts the library project file keeps the trim and Native AOT analyzers enabled with
  # warnings treated as errors. These are build-time properties that leave no reliable
  # trace beyond the IsTrimmable marker in the compiled assembly, so the declaration is
  # checked at its source. This is a design-constraint guard, not requirement evidence: it
  # is intentionally not linked to a requirement. (Native AOT support is a design constraint
  # for now: no Native AOT sample is published or run, and Native AOT for the tool is deferred.)

  - name: TextLint_Project_Configured_EnablesTrimAotAnalyzersAsErrors
    description: "The library project enables the trim and AOT analyzers with warnings as errors"
    tags: [library-project]
    files:
      - pattern: "src/DemaConsulting.TextLint/DemaConsulting.TextLint.csproj"
        count: 1
        text:
          - contains: "<IsAotCompatible>true</IsAotCompatible>"
          - contains: "<TreatWarningsAsErrors>true</TreatWarningsAsErrors>"
