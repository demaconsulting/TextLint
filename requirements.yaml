---
# Root requirements file - includes all system, unit, platform, and OTS requirements
#
# root-tags identifies the tags that mark root requirements for orphan detection.
# Any requirement not tracing (via parent/child links) to a requirement tagged with
# one of these tags is reported as an orphan by:
#   dotnet reqstream --requirements requirements.yaml --enforce
root-tags: [system, quality]
includes:
  - docs/reqstream/quality.yaml
  - docs/reqstream/textlint.yaml
  - docs/reqstream/textlint/platform-requirements.yaml
  - docs/reqstream/textlint/configuration.yaml
  - docs/reqstream/textlint/configuration/text-lint-settings.yaml
  - docs/reqstream/textlint/configuration/settings-loader.yaml
  - docs/reqstream/textlint/file-selection.yaml
  - docs/reqstream/textlint/file-selection/glob-pattern-expander.yaml
  - docs/reqstream/textlint/file-selection/hidden-path-policy.yaml
  - docs/reqstream/textlint/file-selection/file-selector.yaml
  - docs/reqstream/textlint-tool.yaml
  - docs/reqstream/textlint-tool/program.yaml
  - docs/reqstream/textlint-tool/cli.yaml
  - docs/reqstream/textlint-tool/cli/context.yaml
  - docs/reqstream/textlint-tool/self-test.yaml
  - docs/reqstream/textlint-tool/self-test/validation.yaml
  - docs/reqstream/textlint-tool/utilities.yaml
  - docs/reqstream/textlint-tool/utilities/path-helpers.yaml
  - docs/reqstream/textlint-tool/platform-requirements.yaml
  - docs/reqstream/dictionary-builder.yaml
  - docs/reqstream/dictionary-builder/platform-requirements.yaml
  - docs/reqstream/dictionary-builder/builder-program.yaml
  - docs/reqstream/dictionary-builder/word-list-reader.yaml
  - docs/reqstream/dictionary-builder/dictionary-writer.yaml
  - docs/reqstream/dictionary-builder/dictionary-format.yaml
  - docs/reqstream/ots/xunit.yaml
  - docs/reqstream/ots/reqstream.yaml
  - docs/reqstream/ots/buildmark.yaml
  - docs/reqstream/ots/versionmark.yaml
  - docs/reqstream/ots/sarifmark.yaml
  - docs/reqstream/ots/sonarmark.yaml
  - docs/reqstream/ots/reviewmark.yaml
  - docs/reqstream/ots/pandoc.yaml
  - docs/reqstream/ots/weasyprint.yaml
  - docs/reqstream/ots/fileassert.yaml
  - docs/reqstream/ots/sysml2tools.yaml
  - docs/reqstream/ots/yamldotnet.yaml
  - docs/reqstream/ots/filesystemglobbing.yaml
