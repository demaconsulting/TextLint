---
# Spell-Checking with TextLint
#
# PURPOSE:
# - Spell-check this repository with its own released tool
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed
#
# Run from the repository root (the pinned tool is restored by 'dotnet tool restore'):
#   dotnet textlint

version: "0.2"
language: en

# The files that lint.ps1 spell-checks; hidden paths such as .github/ are included
files:
  - "**/*.{md,yaml,yml,json,cs,cpp,hpp,h,txt}"
enableGlobDot: true
words:
  - Dema
  - DEMA
  - demaconsulting
  - filesystemglobbing
  - Geoff
  - Kelk
  - Kuenning
  - Moby
  - ncipollo
  - nestings
  - netstandard
  - Sarif
  - sarif
  - SARIF
  - Setext
  - shopt
  - slnx
  - snupkg
  - sonarscanner
  - thirdparty
  - Titze
  - trimmable
  - Trimmable
  - unidirectionality
  - venv
  - yamldotnet
  - yamlfix

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
  # Word lists: hundreds of thousands of generated entries (the technical lists include
  # intentionally non-English terms), checked by the dictionary builder instead of spell-checking.
  - "dictionaries/**/*.txt"
