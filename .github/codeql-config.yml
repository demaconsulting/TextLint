---
# CodeQL configuration for TextLint
# Suppresses intentional generic catch clauses

name: "TextLint CodeQL Config"

# Query filters to disable specific queries for certain paths
query-filters:
  - exclude:
      id: cs/catch-of-all-exceptions
    paths:
      - src/DemaConsulting.TextLint.Tool/Context.cs
      - src/DemaConsulting.TextLint.Tool/Validation.cs
  # Exclude path-combine warnings in PathHelpers (validated safe usage)
  - exclude:
      id: cs/path-combine
    paths:
      - src/DemaConsulting.TextLint.Tool/PathHelpers.cs
