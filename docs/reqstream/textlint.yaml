---
# TextLint System-Level Requirements
#
# cspell:ignore favourite
#
# PURPOSE:
# - Define system-level requirements describing what consumers of the DemaConsulting.TextLint
#   library package need from it
# - The library owns ALL linting logic (settings, file discovery, dictionaries, tokenization,
#   spell checking, results); the tool is a thin front-end that depends on it, never the reverse
# - The library exposes settings loading, file selection, word lookup over embedded English
#   and technical dictionaries, and spell checking of text and of files in cspell-compatible
#   ways; custom ignore patterns and the remaining cspell features are added, top-down, with
#   their own requirements, design, and verification
# - Package requirements are validated by FileAssert checks of the produced NuGet package
#   (.fileassert.yaml, run by build.yaml) and by assembly-level tests in TextLintTests.cs;
#   functional requirements are validated by system-level tests in TextLintTests.cs and
#   TextLintSpellCheckTests.cs that drive
#   the public API end to end, and the cspell compatibility requirement by the recorded-output
#   corpus tests in CspellParityTests.cs

sections:
  - title: TextLint Requirements
    requirements:
      - id: TextLint-System-Package
        title: The library shall be distributed as the DemaConsulting.TextLint NuGet package.
        tags: [system]
        justification: |
          Consumers (including the TextLint tool) obtain the library as a NuGet package. The
          package identity, its net10.0 assembly, and its publisher metadata must be stable so
          that dependent projects can reference the library by a single, predictable name. The
          primary evidence is the produced package itself: the build packs the library and
          FileAssert inspects the resulting .nupkg (package id, lib/net10.0 assembly and XML
          documentation, license, README, icon, and the companion symbols package). The
          assembly-level tests additionally confirm the compiled assembly carries the same
          identity and metadata.
        tests:
          - TextLint_Package_Packed_ContainsNet10Library
          - TextLint_Package_Packed_HasPackageMetadata
          - TextLint_Assembly_Loaded_HasPackageName
          - TextLint_Assembly_Loaded_HasPackageMetadata

      - id: TextLint-System-ToolIndependent
        title: The library shall be usable without the TextLint tool and shall not depend on it.
        tags: [system]
        justification: |
          The library owns all linting logic so that any .NET application can lint without the
          command-line tool; the tool is only a thin front-end that depends on the library. A
          library that depended on the tool would invert that layering, forcing consumers to take
          the tool (and its console, argument-parsing, and exit-code concerns) with it.
        tests:
          - TextLint_Assembly_Loaded_DoesNotReferenceTool

      - id: TextLint-System-ConfigFile
        title: The library shall load settings from a .textlint.yaml file that uses cspell-compatible key names.
        tags: [system]
        justification: |
          TextLint is meant to replace cspell in existing repositories, so users must be able to
          carry their configuration over with the key names they already know, and to keep their
          lint configuration as code beside the project. An empty file must be valid so a new
          project can start with no configuration.
        children:
          - TextLint-Configuration-FileLoading
          - TextLint-Configuration-KeyMapping
          - TextLint-OTS-YamlDotNet-ParseYaml
        tests:
          - TextLint_Settings_CspellStyleConfigFile_LoadsConfiguredValues
          - TextLint_Settings_SpellingKeysConfigFile_LoadsConfiguredValues
          - TextLint_Settings_EmptyConfigFile_LoadsDefaultSettings

      - id: TextLint-System-ProgrammaticSettings
        title: The library shall let applications supply settings built in code instead of a file.
        tags: [system]
        justification: |
          Applications that embed the library, and the tool when a command line overrides the
          configuration file, must be able to supply settings without writing a file and without
          the risk that later changes to the values they passed alter the settings in force.
        children:
          - TextLint-Configuration-ProgrammaticSettings
        tests:
          - TextLint_Settings_ConstructedInCode_SelectsFiles

      - id: TextLint-System-ConfigErrors
        title: The library shall report each configuration error with the file, line, and column of the problem.
        tags: [system]
        justification: |
          A linter whose own configuration errors are cryptic cannot be adopted in continuous
          integration. Users must be able to find and fix every problem in a settings file from
          the message alone, including a file that is missing or cannot be read.
        children:
          - TextLint-Configuration-ErrorReporting
          - TextLint-OTS-YamlDotNet-SourcePositions
        tests:
          - TextLint_Settings_MalformedConfigFile_ReportsFileLineAndColumn
          - TextLint_Settings_WrongValueType_ReportsFileLineAndColumn
          - TextLint_Settings_MissingConfigFile_ReportsFileError

      - id: TextLint-System-UnsupportedKeys
        title: >-
          The library shall reject a settings file that contains a key it does not support,
          with an error that names the key and its position.
        tags: [system]
        justification: |
          Settings carried over from a cspell configuration may include keys TextLint does not
          support yet. Silently ignoring them would let a setting the user believes is in force
          have no effect, so loading fails and names the key, which tells the user exactly what
          is not available.
        children:
          - TextLint-Configuration-UnsupportedKeys
        tests:
          - TextLint_Settings_UnsupportedKey_ReportsErrorNamingKey

      - id: TextLint-System-FileSelection
        title: >-
          The library shall select the files to check by matching include glob patterns,
          case-sensitively, against paths relative to a root directory.
        tags: [system]
        justification: |
          Choosing which files to lint is the first step of every run. Matching case-sensitively
          on every operating system makes a configuration select the same files on Windows,
          Linux, and macOS, and brace alternatives and bare names are accepted because cspell
          users already write patterns that way.
        children:
          - TextLint-FileSelection-PatternMatching
          - TextLint-FileSelection-PatternForms
          - TextLint-OTS-FileSystemGlobbing-MatchPatterns
        tests:
          - TextLint_Files_IncludePatterns_SelectsMatchingFiles
          - TextLint_Files_BraceAndBareNamePatterns_SelectAtAnyDepth
          - TextLint_Files_DifferentCase_IsNotSelected

      - id: TextLint-System-IgnoredPaths
        title: The library shall exclude files that match the ignore glob patterns from the selection.
        tags: [system]
        justification: |
          Repositories contain generated, vendored, and third-party content that must never be
          linted; users need a way to exclude it that always wins over the include patterns.
        children:
          - TextLint-FileSelection-PatternMatching
        tests:
          - TextLint_Files_IgnorePatterns_ExcludesIgnoredFiles

      - id: TextLint-System-IgnoredDirectoriesSkipped
        title: The library shall not scan the contents of directories excluded by the ignore patterns.
        tags: [system, performance]
        justification: |
          Directories such as node_modules, bin, and obj routinely hold hundreds of thousands of
          files. Scanning them only to discard the results would dominate the run time on large
          repositories, so excluded directories must not be read at all.
        children:
          - TextLint-FileSelection-IgnoredDirectoriesSkipped
          - TextLint-OTS-FileSystemGlobbing-ExcludePruning
        tests:
          - TextLint_Files_IgnoredDirectory_IsNotEnumerated

      - id: TextLint-System-HiddenFiles
        title: >-
          The library shall not let wildcards match hidden files and directories (names starting
          with a dot) unless hidden-file matching is enabled, while hidden names written
          literally in a pattern shall match.
        tags: [system]
        justification: |
          Hidden directories such as .git hold content users never want linted, so a wildcard
          must not reach them by default, matching cspell. Files such as .github workflows are
          often wanted, so naming them explicitly in a pattern must work without enabling hidden
          matching everywhere.
        children:
          - TextLint-FileSelection-HiddenFiles
        tests:
          - TextLint_Files_HiddenEntries_SkippedByDefault
          - TextLint_Files_LiteralHiddenPattern_SelectsHiddenEntries
          - TextLint_Files_HiddenEntries_SelectedWhenEnabled

      - id: TextLint-System-StableOrder
        title: >-
          The library shall return selected files in a stable, platform-independent order using
          forward-slash relative paths.
        tags: [system]
        justification: |
          Reproducible reports, diffs, and result caches require the same files in the same
          order with the same names on every operating system and on every run.
        children:
          - TextLint-FileSelection-StableOrder
        tests:
          - TextLint_Files_SelectedFiles_AreOrderedWithForwardSlashes

      - id: TextLint-System-RootAnchoredPatterns
        title: >-
          The library shall interpret a glob pattern that begins with a single slash as anchored
          to the root directory being searched, not as an absolute file system path.
        tags: [system]
        justification: |
          Users write /build/ or /README.md to mean the project root, as in ignore files and
          cspell configurations. The same pattern must select the same files on every operating
          system, which an interpretation as an absolute path could not guarantee.
        children:
          - TextLint-FileSelection-RootAnchoredPatterns
        tests:
          - TextLint_Files_LeadingSlashPattern_AnchorsAtRoot

      - id: TextLint-System-PatternValidation
        title: >-
          The library shall reject unsupported or malformed glob patterns, including absolute file
          system paths (drive-letter and network forms), negation, backslash separators, and the
          question-mark wildcard, with an error that names the pattern and the reason, and shall
          report such a pattern in a settings file at its line and column.
        tags: [system]
        justification: |
          Some pattern forms users may expect (negation, backslash separators, the ? wildcard,
          absolute or parent-relative paths, unbalanced braces) cannot be honored reliably. Silently
          selecting the wrong files is worse than failing, so the pattern is rejected at the
          earliest point, with enough detail to correct it; the message for ? points to the
          supported * wildcard.
        children:
          - TextLint-FileSelection-PatternValidation
          - TextLint-Configuration-InvalidPatterns
        tests:
          - TextLint_Files_NegatedPattern_ThrowsNamingPattern
          - TextLint_Files_BackslashPattern_ThrowsNamingPattern
          - TextLint_Files_AbsolutePathPattern_ThrowsNamingPattern
          - TextLint_Settings_InvalidPattern_ReportsFileLineAndColumn
          - TextLint_Settings_AbsolutePathPattern_ReportsFileLineAndColumn
          - TextLint_Settings_QuestionMarkPattern_ReportsErrorSuggestingStar

      - id: TextLint-System-CommandLinePaths
        title: >-
          The library shall turn path and pattern arguments typed on a command line, relative or
          absolute and written with the separators of the operating system, into a validated search
          directory and patterns, and shall let the caller name each file found by absolute path when
          an absolute path was given and by relative path otherwise, while settings-file patterns
          remain relative and portable.
        tags: [system]
        justification: |
          Command-line users type what their shell and editor give them, including backslash paths on
          Windows and absolute paths from editors, and expect to see paths in the form they typed in
          the results. Every program built on the library must interpret such input the same way, so
          the rules belong to the library and not to each command-line front-end, while settings files
          stay strict so that one file selects the same files on every platform.
        children:
          - TextLint-FileSelection-CommandLinePaths
          - TextLint-FileSelection-CommandLineReporting
          - TextLint-SpellChecking-ReportFileNames
        tests:
          - TextLint_CommandLinePaths_AbsolutePath_ChecksFileAndNamesItAbsolute
          - TextLint_CommandLinePaths_RelativePath_ChecksFileAndNamesItRelative

      - id: TextLint-System-WordLookup
        title: >-
          The library shall report whether a word is known to the selected language, ignoring
          letter case and treating the typographic apostrophe as the straight apostrophe, and
          shall report text that cannot be a word as not known.
        tags: [system]
        justification: |
          Spell checking asks one question of every word it meets: is this a known word? Source
          text is written in any capitalization, with straight or typographic apostrophes (word
          processors and web pages produce the curly one), and contains tokens that are not words
          at all. cspell ignores case by default and treats the two apostrophes alike, so
          matching that behavior keeps migrated projects quiet where they were quiet. A lookup
          that threw for odd text, instead of answering "not known", would make a spell checker
          crash on real files.
        children:
          - TextLint-Dictionaries-WordLookup
          - TextLint-Dictionaries-WordMatching
        tests:
          - TextLint_Dictionary_KnownWord_IsKnown
          - TextLint_Dictionary_UnknownWord_IsNotKnown
          - TextLint_Dictionary_DifferentCase_IsKnown
          - TextLint_Dictionary_TypographicApostrophe_IsKnown
          - TextLint_Dictionary_UnusualText_IsHandledWithoutError

      - id: TextLint-System-EnglishLanguages
        title: >-
          The library shall provide American English (the default) and British English, selectable
          by the language names en, en-US, and en-GB alone or together, and shall reject any other
          language with an error that names it.
        tags: [system]
        justification: |
          Users write in different dialects, and a word that is correct in one (favorite) is a
          mistake in the other (favourite) unless the checker knows which dialect is intended. The
          names and the American default follow cspell so that configurations carry over, and a
          project that mixes dialects can select both. An unsupported language must fail loudly
          rather than silently fall back to another dialect, which would hide the mistake.
        children:
          - TextLint-Dictionaries-LanguageSelection
        tests:
          - TextLint_Dictionary_DefaultLanguage_AcceptsAmericanNotBritishSpelling
          - TextLint_Dictionary_BritishLanguage_AcceptsBritishNotAmericanSpelling
          - TextLint_Dictionary_BothLanguages_AcceptBothSpellings
          - TextLint_Dictionary_UnsupportedLanguage_ThrowsNamingLanguage

      - id: TextLint-System-TechnicalTerms
        title: >-
          The library shall treat common software terms (programming languages, tools, companies,
          file types, and licenses) as known words in every language selection.
        tags: [system]
        justification: |
          Source code and documentation are full of terms that no general English word list
          contains (kubernetes, github, powershell). Reporting each as a spelling mistake would
          make the linter unusable on software projects, and these terms do not depend on the
          dialect of the prose around them.
        children:
          - TextLint-Dictionaries-TechnicalTerms
        tests:
          - TextLint_Dictionary_TechnicalTerm_IsKnownInEveryLanguage

      - id: TextLint-System-SelfContainedLookup
        title: >-
          The library shall look words up without requiring any dictionary files, configuration,
          or network access at run time.
        tags: [system]
        justification: |
          The library is distributed as a single NuGet package and used from a command-line tool
          that runs in build pipelines and containers. A lookup that depended on data files being
          found beside the program, or on a network, would be a source of installation and path
          failures; vocabulary that ships with the library works wherever the library does. The
          evidence is a lookup from a copy of the library with nothing beside it, an inspection of
          the loaded assembly, and an inspection of the produced package.
        children:
          - TextLint-Dictionaries-ShippedData
        tests:
          - TextLint_Dictionary_LibraryAssemblyAlone_LooksUpWords
          - TextLint_Assembly_Loaded_EmbedsDictionaries
          - TextLint_Package_Packed_ContainsEmbeddedDictionaries

      - id: TextLint-System-DictionaryContent
        title: >-
          The library shall know every word of the repository word lists, except the words of the
          reviewed exclusions list, for the language selection that includes the list.
        tags: [system]
        justification: |
          The word lists in the repository are the maintained definition of what the library
          considers a correct word. A word that is on a list but is not known to the library
          would be a silent failure of the build that turns the lists into dictionaries, so the
          whole vocabulary is checked, in every capitalization, against the public behavior. The
          only deliberate exceptions are the reviewed exclusions, which are checked separately.
        children:
          - TextLint-Dictionaries-ShippedData
        tests:
          - TextLint_Dictionary_EveryListedWord_IsKnown

      - id: TextLint-System-EnglishVocabulary
        title: >-
          The library shall know the inflected and derived forms of English words common in technical
          writing, and shall know a British-only or American-only spelling only for the language
          selection of that dialect.
        tags: [system]
        justification: |
          The DEMA repositories showed that a base English word list misses regular derivations such as
          "testability" and "reviewable", which buries real findings under false ones, while accepting
          the wrong dialect's spelling ("catalogue" for American English) would hide real findings. The
          behavior is observed through the public lookup for each language selection.
        children:
          - TextLint-Dictionaries-DerivedForms
        tests:
          - TextLint_Dictionary_DerivedFormsAndRegionalSpellings_FollowTheLanguageSelection

      - id: TextLint-System-ExcludedWords
        title: >-
          The library shall not know any word of the reviewed exclusions list in any language
          selection.
        tags: [system]
        justification: |
          Imported word lists contain entries that hide real typos, such as a misspelling or a rare
          word that is almost always a mistyped common one. The reviewed exclusions list names
          them, and a word on it must be reported as unknown whichever list it came from, in every
          capitalization, as observed through the public lookup.
        children:
          - TextLint-Dictionaries-ExcludedWords
        tests:
          - TextLint_Dictionary_EveryExcludedWord_IsUnknown

      - id: TextLint-System-ConcurrentLookup
        title: The library shall allow word lookups from many threads at the same time.
        tags: [system]
        justification: |
          TextLint checks files in parallel across all processor cores, so every thread asks the
          same dictionaries at once. Lookups that needed external locking, or that gave wrong
          answers under contention, would make parallel checking slow or incorrect.
        children:
          - TextLint-Dictionaries-SharedUse
        tests:
          - TextLint_Dictionary_ParallelLookups_ReturnCorrectAnswers

      - id: TextLint-System-ThirdPartyNotices
        title: >-
          The library package shall carry the license notices for the third-party data embedded in
          the library and for the third-party rules that its spell checking is derived from.
        tags: [system]
        justification: |
          The English word lists and the technical term lists come from third parties whose
          licenses require their copyright and permission notices to accompany every copy of the
          data, and the default ignore patterns of the spell checker are ported from cspell under
          the same kind of requirement. The package is the copy that reaches users, so the notices
          must be in it. The evidence is the produced package itself, inspected by FileAssert.
        tests:
          - TextLint_Package_Packed_ContainsThirdPartyNotices

      - id: TextLint-System-CheckText
        title: >-
          The library shall check a string of text, without files, and report each unknown word
          with its line, its column, and the word.
        tags: [system]
        justification: |
          Editors, build steps, and embedding applications hold text that is not a file on disk.
          Checking a string is also the simplest observable form of the product's purpose, so it
          is the basis for every other spell-checking behavior.
        children:
          - TextLint-SpellChecking-TextChecking
        tests:
          - TextLint_CheckText_UnknownWord_ReportsLineColumnAndWord
          - TextLint_CheckText_KnownWords_ReportsNothing

      - id: TextLint-System-SpellCheck
        title: >-
          The library shall check the text of the files selected by the settings and report each
          unknown word with its file, line, column, and the word.
        tags: [system]
        justification: |
          Checking the files of a repository is the purpose of the product: the settings choose
          the files, and every unknown word must be reported where a user can find it, in a form
          that editors and build servers can link to.
        children:
          - TextLint-SpellChecking-FileChecking
          - TextLint-SpellChecking-TextChecking
        tests:
          - TextLint_SpellCheck_FilesWithUnknownWords_ReportsFileLineColumnAndWord
          - TextLint_SpellCheck_CleanFiles_ReportsNothing

      - id: TextLint-System-WordSplitting
        title: >-
          The library shall split identifiers and prose into words at case changes, digits,
          underscores, hyphens, and other punctuation, keep apostrophes inside words, and not
          check words shorter than the minimum word length.
        tags: [system]
        justification: |
          Source code and documentation are full of identifiers. A user expects fooBar_baz to be
          checked as the words foo, Bar, and baz, and does not want short fragments, such as the
          variable name idx, reported. cspell behaves this way, so migrated projects stay quiet
          where they were quiet.
        children:
          - TextLint-TextScanning-WordExtraction
          - TextLint-SpellChecking-TextChecking
        tests:
          - TextLint_CheckText_CamelAndSnakeCase_ReportsEachWordSeparately
          - TextLint_CheckText_ShortWords_AreNotChecked
          - TextLint_CheckText_ApostropheWords_StayWhole

      - id: TextLint-System-KnownWordForms
        title: >-
          The library shall accept the possessive of a known word and a known word that follows a
          backslash escape.
        tags: [system]
        justification: |
          Without these allowances prose such as "the parser's output" and string literals such
          as "\nfoo" produce findings that cspell does not, which would make a migrated project
          noisy and the findings untrustworthy.
        children:
          - TextLint-SpellChecking-TextChecking
        tests:
          - TextLint_CheckText_PossessiveOfKnownWord_IsAccepted
          - TextLint_CheckText_WordAfterBackslashEscape_IsAccepted

      - id: TextLint-System-IgnoredText
        title: >-
          The library shall not check URLs, email addresses, hexadecimal values, UUIDs, hashes,
          and encoded data.
        tags: [system]
        justification: |
          These strings are never prose, and their fragments would bury real findings. cspell
          ignores them by default, so a migrated project must find them ignored here too.
        children:
          - TextLint-TextScanning-IgnoredPatterns
        tests:
          - TextLint_CheckText_UrlsAndEmails_AreNotChecked
          - TextLint_CheckText_HexUuidAndHashValues_AreNotChecked
          - TextLint_CheckText_EncodedData_IsNotChecked

      - id: TextLint-System-Directives
        title: >-
          The library shall let comments in the text switch off checking for a region, for a
          line, and for the next line, and add words for the document.
        tags: [system]
        justification: |
          Directives in comments are how cspell users silence deliberate exceptions next to the
          text that needs them. A project migrated from cspell relies on them, and without them
          every exception would have to be added to the project settings.
        children:
          - TextLint-TextScanning-Directives
          - TextLint-SpellChecking-TextChecking
        tests:
          - TextLint_CheckText_DisableEnableBlock_SkipsRegion
          - TextLint_CheckText_DisableLine_SkipsLine
          - TextLint_CheckText_DisableNextLine_SkipsNextLine
          - TextLint_CheckText_IgnoreAndWordsDirectives_AddDocumentWords
          - TextLint_CheckText_UnterminatedDisable_RunsToEndOfText

      - id: TextLint-System-DirectivePrefixes
        title: >-
          The library shall accept the directive prefixes cspell, spell, spellchecker,
          spell-checker, and textlint, in any letter case.
        tags: [system]
        justification: |
          The cspell prefixes keep existing comments working during a migration, and the textlint
          prefix lets a project use the name of the tool it now runs.
        children:
          - TextLint-TextScanning-Directives
        tests:
          - TextLint_CheckText_AllDirectivePrefixes_AreAccepted

      - id: TextLint-System-UnsupportedDirectives
        title: >-
          The library shall report, at its position, a directive that cspell supports and the
          library does not.
        tags: [system]
        justification: |
          An author who writes a directive believes it is in force. A directive that silently
          does nothing would hide a difference from cspell, so it is reported where it is written.
        children:
          - TextLint-TextScanning-Directives
        tests:
          - TextLint_CheckText_UnsupportedDirective_ReportsPosition

      - id: TextLint-System-LanguageSetting
        title: >-
          The library shall use the language setting to choose the dictionary, and shall report
          an unsupported language in a settings file as an error at its position.
        tags: [system]
        justification: |
          A word that is correct in American English (favorite) is a mistake in British English
          and the reverse, so the language setting must change the result. An unsupported
          language must fail loudly rather than fall back to another dialect.
        children:
          - TextLint-Configuration-SpellingSettings
          - TextLint-Configuration-InvalidSpellingValues
          - TextLint-SpellChecking-TextChecking
        tests:
          - TextLint_SpellCheck_BritishLanguage_AcceptsBritishNotAmericanSpelling
          - TextLint_Settings_UnsupportedLanguage_ReportsFileLineAndColumn

      - id: TextLint-System-WordLists
        title: >-
          The library shall accept the words of the words and ignoreWords settings, always report
          the words of the flagWords setting, and apply the order ignored, then flagged, then
          accepted, then dictionary, matching letter case as cspell does.
        tags: [system]
        justification: |
          Every project has a vocabulary of its own and some terms it forbids. cspell users
          expect an ignored word never to be reported, a flagged word always to be, and an entry
          written in lower case to match any letter case, so the same configuration must give the
          same answers here. An entry that could never match must be reported when the settings
          are loaded, because it would otherwise have no effect.
        children:
          - TextLint-TextScanning-WordListEntries
          - TextLint-Configuration-SpellingSettings
          - TextLint-Configuration-InvalidSpellingValues
          - TextLint-SpellChecking-TextChecking
        tests:
          - TextLint_CheckText_WordsSetting_AcceptsAnyCase
          - TextLint_CheckText_FlagWords_ReportsFlaggedKind
          - TextLint_CheckText_FlagWordCapitalEntry_MatchesExactCase
          - TextLint_CheckText_IgnoreWordsOverrideFlagWords_ReportsNothing
          - TextLint_CheckText_WordWithDigitsOrPunctuation_MatchesWholeToken
          - TextLint_Settings_UnusableWordEntry_ReportsFileLineAndColumn

      - id: TextLint-System-MinimumWordLength
        title: >-
          The library shall not check words shorter than the minWordLength setting, except
          flagged words, and shall report an invalid value in a settings file as an error at its
          position.
        tags: [system]
        justification: |
          The minimum length tunes how noisy the checker is: short abbreviations and variable
          names are quiet at the default, and a project can raise or lower the limit. A flagged
          word is reported whatever its length because the user asked for exactly that word.
        children:
          - TextLint-Configuration-SpellingSettings
          - TextLint-Configuration-InvalidSpellingValues
          - TextLint-SpellChecking-TextChecking
        tests:
          - TextLint_CheckText_MinWordLengthRaised_SkipsShorterWords
          - TextLint_CheckText_MinWordLengthLowered_ChecksShorterWords

      - id: TextLint-System-FileEncodings
        title: >-
          The library shall read UTF-8 files with or without a byte order mark and UTF-16 files
          with a byte order mark, and shall report positions relative to the decoded text.
        tags: [system]
        justification: |
          Real repositories contain files in these encodings, and a finding is useful only if its
          position is the position a user sees in an editor, whatever the encoding or the mark.
        children:
          - TextLint-SpellChecking-FileChecking
        tests:
          - TextLint_SpellCheck_Utf8Utf16AndBom_ReportSamePositions

      - id: TextLint-System-UncheckableFiles
        title: >-
          The library shall skip files that look binary and report them, and shall report a file
          it cannot read without stopping the run.
        tags: [system]
        justification: |
          A repository holds images, archives, and files that other programs have locked. One such
          file must not fail a whole run, and the user must still be told which files were not
          checked so that nothing is silently left out.
        children:
          - TextLint-SpellChecking-FileChecking
        tests:
          - TextLint_SpellCheck_BinaryFile_IsSkippedAndReported
          - TextLint_SpellCheck_UnreadableFile_IsReportedAndRunContinues

      - id: TextLint-System-MaxFileSize
        title: >-
          The library shall skip files larger than the maxFileSize setting and report them, and
          shall report an invalid value in a settings file as an error at its position.
        tags: [system]
        justification: |
          Generated files can be enormous, and a project may choose not to check them. The skip
          must be reported so it is never mistaken for a clean file. There is no limit unless one
          is configured, as in cspell.
        children:
          - TextLint-Configuration-SpellingSettings
          - TextLint-Configuration-InvalidSpellingValues
          - TextLint-SpellChecking-FileChecking
        tests:
          - TextLint_SpellCheck_FileOverMaxSize_IsSkippedAndReported
          - TextLint_Settings_InvalidMaxFileSize_ReportsFileLineAndColumn

      - id: TextLint-System-DeterministicResults
        title: >-
          The library shall return the same results in the same order (by file path, then line,
          then column) however many files are checked at the same time, and shall let the caller
          limit that number.
        tags: [system]
        justification: |
          Files are checked in parallel to use every processor core, but build output must be
          reproducible: a difference between two runs must mean a difference in the files, never
          in the timing. A caller must be able to leave cores free for other work.
        children:
          - TextLint-SpellChecking-ParallelDeterminism
        tests:
          - TextLint_SpellCheck_DifferentConcurrency_ReturnsIdenticalOrderedResults
          - TextLint_SpellCheck_InvalidConcurrency_Throws

      - id: TextLint-System-Cancellation
        title: The library shall stop checking and signal cancellation when its caller cancels.
        tags: [system]
        justification: |
          A run over a large repository can take long enough that a user or a host needs to
          abandon it, and abandoning it must not leave work running or return a partial result
          that looks complete.
        children:
          - TextLint-SpellChecking-ParallelDeterminism
          - TextLint-FileSelection-Cancellation
        tests:
          - TextLint_SpellCheck_CancelledToken_ThrowsOperationCanceled

      - id: TextLint-System-CspellCompatibility
        title: >-
          The library shall report the same unknown words, at the same positions, as cspell for
          the documented word-splitting, ignore, directive, and word-list rules.
        tags: [system]
        justification: |
          The stated goal is to replace cspell in existing repositories without surprises. The
          evidence is a set of corpora that were checked by the real cspell, whose recorded
          output is compared with the library's, and a list of the differences that are
          deliberate, which the comparison must match exactly so that a fixed or a new difference
          is noticed.
        tests:
          - TextLint_CspellParity_TokenizationCorpus_MatchesRecordedCspellOutput
          - TextLint_CspellParity_DirectiveCorpora_MatchRecordedCspellOutput
          - TextLint_CspellParity_CrlfDirectiveCorpus_MatchesRecordedCspellOutput
          - TextLint_CspellParity_WordListCorpus_MatchesRecordedCspellOutput
          - TextLint_CspellParity_MinimumLengthCorpora_MatchRecordedCspellOutput
          - TextLint_CspellParity_PossessiveCorpus_MatchesRecordedCspellOutput
          - TextLint_CspellParity_KnownDivergences_AreExactlyTheDocumentedOnes
