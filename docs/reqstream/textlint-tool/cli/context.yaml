---
# Software Unit Requirements for the Context Class
#
# The Context class handles command-line argument parsing and program output.
# It is the primary interface between the user's command-line invocation and
# the tool's internal logic.

sections:
  - title: Context Unit Requirements
    requirements:
      - id: TextLintTool-Context-ArgumentParsing
        title: The Context class shall parse command-line arguments into structured properties.
        justification: |
          Provides a standardized approach to command-line argument parsing and output
          handling across all DEMA Consulting DotNet Tools.
        tests:
          - Context_Create_NoArguments_ReturnsDefaultContext
          - Context_Create_VersionFlag_SetsVersionTrue
          - Context_Create_ShortVersionFlag_SetsVersionTrue
          - Context_Create_HelpFlag_SetsHelpTrue
          - Context_Create_ShortHelpFlag_H_SetsHelpTrue
          - Context_Create_ShortHelpFlag_Question_SetsHelpTrue
          - Context_Create_SilentFlag_SetsSilentTrue
          - Context_Create_ValidateFlag_SetsValidateTrue
          - Context_Create_ResultsFlag_SetsResultsFile
          - Context_Create_LogFlag_OpensLogFile
          - Context_Create_ResultAliasFlag_SetsResultsFile
          - Context_Create_DepthFlag_SetsHeadingDepth
          - Context_Create_NoDepthFlag_ReturnsDefaultHeadingDepth

      - id: TextLintTool-Context-InvalidArgs
        title: The Context class shall reject unknown or malformed command-line arguments with a descriptive error.
        justification: |
          Providing clear feedback for invalid arguments helps users quickly correct
          mistakes and prevents silent misconfiguration.
        tests:
          - Context_Create_UnknownArgument_ThrowsArgumentException
          - Context_Create_LogFlag_WithoutValue_ThrowsArgumentException
          - Context_Create_ResultsFlag_WithoutValue_ThrowsArgumentException
          - Context_Create_ResultAliasFlag_WithoutValue_ThrowsArgumentException
          - Context_Create_DepthFlag_WithoutValue_ThrowsArgumentException
          - Context_Create_DepthFlag_NonIntegerValue_ThrowsArgumentException
          - Context_Create_DepthFlag_ZeroValue_ThrowsArgumentException
          - Context_Create_DepthFlag_ExceedsMaxValue_ThrowsArgumentException

      - id: TextLintTool-Context-ConsoleOutput
        title: The Context class shall write output to the console unless the silent flag is set.
        justification: |
          Provides visible output to users running the tool interactively, while allowing
          automated environments to suppress console output via the silent flag.
        tests:
          - Context_WriteLine_NotSilent_WritesToConsole
          - Context_WriteError_NotSilent_WritesToConsole

      - id: TextLintTool-Context-LogOutput
        title: The Context class shall additionally write output to a log file when the log flag is set.
        justification: |
          Provides persistent logging for debugging and audit trails, enabling post-run
          inspection of tool output without requiring console capture.
        tests:
          - Context_Create_LogFlag_OpensLogFile
          - Context_WriteError_WithLogFile_WritesToLogFile

      - id: TextLintTool-Context-Silent
        title: The Context class shall suppress console output when the silent flag is set.
        justification: |
          Enables automated scripts and CI/CD pipelines to run the tool without
          cluttering output logs.
        tests:
          - Context_Create_SilentFlag_SetsSilentTrue
          - Context_WriteLine_Silent_DoesNotWriteToConsole
          - Context_WriteError_Silent_DoesNotWriteToConsole

      - id: TextLintTool-Context-ErrorOutput
        title: The Context class shall write error messages to stderr.
        justification: |
          Error messages must be written to stderr so they remain visible to the user
          without polluting stdout, which consumers may pipe or redirect for data capture.
        tests:
          - Context_WriteError_NotSilent_WritesToConsole

      - id: TextLintTool-Context-ExitCode
        title: The Context class shall track errors and expose a non-zero exit code when errors have occurred.
        justification: |
          Callers (scripts, CI/CD pipelines) must be able to detect failure conditions
          programmatically via the process exit code.
        tests:
          - Context_WriteError_Called_SetsErrorExitCode

      - id: TextLintTool-Context-LogFailure
        title: The Context class shall report an error when the specified log file cannot be opened.
        justification: |
          Failure to open a log file must be surfaced immediately so that users know their
          log output will not be captured, preventing silent data loss in audit or
          compliance workflows.
        tests:
          - Context_Create_LogFlag_InvalidPath_ThrowsInvalidOperationException

      - id: TextLintTool-Context-Globs
        title: >-
          The Context class shall collect every positional argument as a file pattern, exactly as typed and in
          order, as an immutable list, mixed with options in any order, and shall default to no patterns.
        justification: |
          The files to check are the main input of the tool; the parser must not alter them, because their
          interpretation belongs to the library, and a list that a consumer could change would make the
          parsed command line untrustworthy.
        tests:
          - Context_Create_NoCheckOptions_ReturnsCheckDefaults
          - Context_Create_PositionalArguments_SetsGlobsInOrder
          - Context_Create_Globs_AreImmutable
          - Context_Create_OptionsAndGlobsMixed_ParsesBoth

      - id: TextLintTool-Context-ConfigOption
        title: The Context class shall expose the settings file named by the --config option as typed.
        justification: |
          The settings file is chosen by the user; its path must reach the check unchanged.
        tests:
          - Context_Create_ConfigFlag_SetsConfigFile

      - id: TextLintTool-Context-RootOption
        title: The Context class shall expose the root directory named by the --root option as typed.
        justification: |
          The root directory is chosen by the user; its path must reach the check unchanged.
        tests:
          - Context_Create_RootFlag_SetsRoot

      - id: TextLintTool-Context-LanguageOption
        title: >-
          The Context class shall expose the languages named by the --language option unchanged, leaving their
          validation to the library.
        justification: |
          The supported languages are defined once, in the library; the parser must not duplicate that list.
        tests:
          - Context_Create_LanguageFlag_SetsLanguage

      - id: TextLintTool-Context-AllowEmpty
        title: The Context class shall expose whether the --allow-empty flag was given.
        justification: |
          Whether an empty selection is acceptable is chosen by the user and decides the exit status.
        tests:
          - Context_Create_AllowEmptyFlag_SetsAllowEmptyTrue

      - id: TextLintTool-Context-MaxParallelism
        title: >-
          The Context class shall expose the number given to the --max-parallelism option, and shall reject
          anything that is not an integer from 1 to the largest integer.
        justification: |
          A limit below one cannot be honored, and a number that cannot be read must not become the default
          silently.
        tests:
          - Context_Create_MaxParallelismFlag_SetsMaxParallelism
          - Context_Create_MaxParallelismFlag_InvalidValue_ThrowsArgumentException

      - id: TextLintTool-Context-OptionValidation
        title: >-
          The Context class shall reject an option that takes a value when the value is missing, empty, white
          space, or looks like another option, shall reject a value option that is given more than once
          (counting an option and its alias as one), shall reject an unknown option wherever it appears, and
          shall reject an empty pattern, each with an error that names the option.
        justification: |
          A forgotten value would otherwise swallow the next option, a repeated option hides a scripting
          mistake, and an empty value almost always comes from an unset variable; each must be reported where
          it is made.
        tests:
          - Context_Create_ValueOptionWithoutValue_ThrowsArgumentException
          - Context_Create_ValueOptionWithBlankOrOptionValue_ThrowsArgumentException
          - Context_Create_DuplicateValueOption_ThrowsArgumentException
          - Context_Create_ResultsAndAlias_ThrowsArgumentException
          - Context_Create_UnknownOptionAfterGlob_ThrowsArgumentException
          - Context_Create_BlankGlob_ThrowsArgumentException

      - id: TextLintTool-Context-MarkFailed
        title: >-
          The Context class shall let a caller mark the run as failed without writing any output, which sets the
          exit code to 1.
        justification: |
          A check that found issues has already printed each of them as a result line, so reporting the failure
          again as an error message would only add noise, yet the exit code must still report it.
        tests:
          - Context_MarkFailed_Called_SetsErrorExitCodeSilently
