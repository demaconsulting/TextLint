---
# Software Unit Requirements for the Program Class
#
# The Program unit is the top-level command dispatcher for the tool.

sections:
  - title: Program Unit Requirements
    requirements:
      - id: TextLintTool-Program-Version
        title: The Program class shall support -v and --version flags to display version information.
        justification: |
          Users need to quickly identify the version of the tool they are using for
          troubleshooting and compatibility verification.
        tests:
          - Program_Run_WithVersionFlag_DisplaysVersionOnly
          - Program_Run_WithShortVersionFlag_DisplaysVersion
          - Program_Version_Read_ReturnsNonEmptyString

      - id: TextLintTool-Program-Help
        title: The Program class shall support -?, -h, and --help flags to display usage information.
        justification: |
          Users need access to command-line usage documentation without requiring
          external resources.
        tests:
          - Program_Run_WithHelpFlag_DisplaysUsageInformation
          - Program_Run_WithShortHelpFlag_DisplaysUsage
          - Program_Run_WithQuestionMarkFlag_DisplaysUsage

      - id: TextLintTool-Program-Validate
        title: The Program class shall support --validate flag to invoke the self-validation framework.
        justification: |
          Provides a built-in mechanism to verify the tool is functioning correctly
          in the deployment environment.
        tests:
          - Program_Run_WithValidateFlag_RunsValidation

      - id: TextLintTool-Program-ExitCode
        title: The Program class shall return a non-zero exit code on failure.
        justification: |
          Callers (scripts, CI/CD pipelines) must be able to detect failure conditions
          programmatically via the process exit code.
        tests:
          - Program_Main_WithInvalidArgs_ReturnsNonZeroExitCode
          - Program_Main_DuplicateOption_ReturnsNonZeroExitCode
          - Program_Main_SilentUnknownArgument_ReportsErrorAndFails

      - id: TextLintTool-Program-Check
        title: >-
          The Program class shall, when no version, help, or validation action is requested, print the banner and
          run the check that the command line describes.
        justification: |
          The check is the purpose of the tool; the banner identifies the tool in every log, and the check is
          delegated so that the program holds no linting logic.
        tests:
          - Program_Run_Patterns_RunsCheck
          - Program_Run_NoPatterns_DisplaysBannerAndUsageError

      - id: TextLintTool-Program-HelpOptions
        title: >-
          The Program class shall list in the usage text every option, the meaning of the pattern arguments, and
          the exit codes.
        justification: |
          Users must be able to learn the full interface, including how failure is reported, from the tool
          itself.
        tests:
          - Program_Run_HelpFlag_ListsAllOptionsAndExitCodes

      - id: TextLintTool-Program-Cancellation
        title: >-
          The Program class shall turn a user interruption into the cancellation of the running check, so that
          the check ends with a message and a failure exit code.
        justification: |
          A user who presses Ctrl+C expects a prompt, clean stop and not a half-written result or a stack trace.
        tests:
          - Program_RunCancelable_CancelledToken_ReportsCancellationAndFails
