---
# FileSelection Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the TextLint FileSelection subsystem
# - The FileSelection subsystem turns include and ignore glob patterns into the ordered list of
#   files to check beneath a root directory; the include patterns are an ordered list in which !
#   excludes and the last match wins, and the same list type chooses the files of a settings override
# - Subsystem requirements decompose the system requirements for file selection; they are
#   validated by FileSelectionSubsystemTests.cs

sections:
  - title: TextLint Requirements
    sections:
      - title: FileSelection Requirements
        requirements:
          - id: TextLint-FileSelection-PatternMatching
            title: >-
              The FileSelection subsystem shall select the files that match an include pattern
              and no ignore pattern, relative to the root and case-sensitively.
            justification: |
              This is the core behavior of file selection: include patterns choose files, ignore
              patterns always win, and the same configuration must select the same files on every
              operating system.
            children:
              - TextLint-FileSelection-FileSelector-Matching
              - TextLint-FileSelection-FileSelector-CaseSensitive
              - TextLint-FileSelection-OrderedGlobList-CaseSensitive
            tests:
              - FileSelectionSubsystem_Select_IncludeAndIgnorePatterns_SelectsExpectedFiles
              - FileSelectionSubsystem_Select_DifferentCase_IsNotSelected

          - id: TextLint-FileSelection-OrderedPatterns
            title: >-
              The FileSelection subsystem shall treat the include patterns as an ordered list in which a
              pattern that begins with ! removes files that earlier patterns selected and a later pattern
              can select them again, so that the last matching pattern decides, while a list without such a
              pattern selects what it always selected and the ignore patterns still win.
            justification: |
              A project needs to say which files are permanently in scope, with exceptions, without listing
              every file. The ordered form is the one ReviewMark and ignore files already use, and the same
              rule lets an override choose its files. Lists written before the form existed must not change.
            children:
              - TextLint-FileSelection-OrderedGlobList-LastMatchWins
              - TextLint-FileSelection-OrderedGlobList-HiddenRule
              - TextLint-FileSelection-OrderedGlobList-ConcurrentUse
              - TextLint-FileSelection-FileSelector-OrderedIncludes
              - TextLint-FileSelection-FileSelector-ListWithoutNegation
            tests:
              - FileSelectionSubsystem_Select_OrderedNegation_SelectsLastMatchAndPrunes

          - id: TextLint-FileSelection-OrderedPruning
            title: >-
              The FileSelection subsystem shall not enumerate a directory whose files are all excluded by an
              ordered pattern that no later pattern can undo, and shall enumerate a directory that a later
              pattern can select from.
            justification: |
              Excluding a vendored tree with a negation must be as cheap as ignoring it, or users would be
              pushed to a less expressive setting for speed; but pruning a directory that a later pattern
              brings back would silently lose files, so only the provably excluded are skipped.
            children:
              - TextLint-FileSelection-OrderedGlobList-SubtreePruning
              - TextLint-FileSelection-FileSelector-OrderedPruning
            tests:
              - FileSelectionSubsystem_Select_OrderedNegation_SelectsLastMatchAndPrunes

          - id: TextLint-FileSelection-PatternForms
            title: >-
              The FileSelection subsystem shall accept brace alternatives and bare names
              (patterns without a separator) in patterns.
            justification: |
              Users migrating from cspell already write patterns such as **/*.{md,cs} and
              node_modules, and expect a bare name to match at any depth.
            children:
              - TextLint-FileSelection-GlobPatternExpander-BraceExpansion
              - TextLint-FileSelection-GlobPatternExpander-BareNames
            tests:
              - FileSelectionSubsystem_Select_BraceAlternatives_SelectsAllAlternatives
              - FileSelectionSubsystem_Select_BareName_MatchesAtAnyDepth

          - id: TextLint-FileSelection-PatternValidation
            title: >-
              The FileSelection subsystem shall reject unsupported or malformed patterns,
              including absolute paths, an include list that starts with a negation, and a
              negation in the ignore patterns, with an error that names the pattern.
            justification: |
              Patterns that cannot be honored reliably must fail visibly rather than silently
              select the wrong files. A negation at the start of a list has nothing to remove, and the
              ignore patterns are a fence that cannot re-include files, so both can only be mistakes.
            children:
              - TextLint-FileSelection-GlobPatternExpander-Validation
              - TextLint-FileSelection-FileSelector-InvalidPatterns
              - TextLint-FileSelection-OrderedGlobList-LeadingNegationRejected
              - TextLint-FileSelection-OrderedGlobList-InvalidEntries
            tests:
              - FileSelectionSubsystem_Select_NegatedPattern_ThrowsNamingPattern
              - FileSelectionSubsystem_Select_LeadingNegationAndNegatedIgnore_ThrowNamingPattern
              - FileSelectionSubsystem_Select_AbsolutePathPattern_ThrowsNamingPattern

          - id: TextLint-FileSelection-RootAnchoredPatterns
            title: >-
              The FileSelection subsystem shall interpret a pattern that begins with a single slash
              as anchored to the root directory, not as an absolute path.
            justification: |
              Users write /build/ or /README.md to mean the project root, as in ignore files and
              cspell configurations; the pattern must select the same files on every platform.
            children:
              - TextLint-FileSelection-GlobPatternExpander-RootAnchoring
            tests:
              - FileSelectionSubsystem_Select_LeadingSlashPattern_AnchorsToRoot

          - id: TextLint-FileSelection-HiddenFiles
            title: >-
              The FileSelection subsystem shall not let wildcards match hidden files and
              directories unless hidden-file matching is enabled, and shall let hidden names
              written literally in a pattern match.
            justification: |
              Wildcards must not reach content such as .git by default, matching cspell, while an
              explicit pattern such as .github/** must still select what it names.
            children:
              - TextLint-FileSelection-FileSelector-HiddenFiles
              - TextLint-FileSelection-HiddenPathPolicy-WildcardsSkipHidden
              - TextLint-FileSelection-HiddenPathPolicy-LiteralSegmentsMatchHidden
            tests:
              - FileSelectionSubsystem_Select_HiddenEntries_SkippedUnlessEnabled
              - FileSelectionSubsystem_Select_LiteralHiddenPattern_SelectsHiddenEntries

          - id: TextLint-FileSelection-IgnoredDirectoriesSkipped
            title: >-
              The FileSelection subsystem shall not enumerate directories excluded by the ignore
              patterns or hidden from wildcards.
            justification: |
              Excluded directories such as node_modules and .git can hold hundreds of thousands
              of files; reading them only to discard the result would dominate the run time.
            children:
              - TextLint-FileSelection-FileSelector-PrunedTraversal
              - TextLint-FileSelection-HiddenPathPolicy-DirectoryTraversal
            tests:
              - FileSelectionSubsystem_Select_IgnoredDirectory_IsNotEnumerated

          - id: TextLint-FileSelection-Cancellation
            title: >-
              The FileSelection subsystem shall stop a selection and signal cancellation, without returning a
              partial selection, when the caller's token is canceled before or while the directory tree is read.
            justification: |
              Walking a very large tree can take long, and a caller that abandons the work must not have to
              wait for the walk to end or receive a selection that looks complete.
            children:
              - TextLint-FileSelection-FileSelector-Cancellation
            tests:
              - FileSelectionSubsystem_Select_CanceledDuringWalk_StopsAndThrows

          - id: TextLint-FileSelection-StableOrder
            title: >-
              The FileSelection subsystem shall return files ordered by ordinal relative path
              with forward-slash separators.
            justification: |
              A stable order and path form make results reproducible across platforms and runs,
              which reports, diffs, and caches depend on.
            children:
              - TextLint-FileSelection-FileSelector-StableOrder
            tests:
              - FileSelectionSubsystem_Select_UnorderedTree_ReturnsOrdinalOrder

          - id: TextLint-FileSelection-CommandLinePaths
            title: >-
              The FileSelection subsystem shall turn path and pattern arguments typed on a command line,
              relative or absolute and written with the separators of the operating system, into a
              validated search directory and patterns, so that an absolute path inside the root directory
              selects the same files as its relative form and one outside it selects files beneath its own
              directory. An absolute path that names an existing directory selects everything beneath it.
            justification: |
              People type paths the way their shell and operating system show them: PowerShell completes
              backslash paths, and editors pass absolute paths. Settings-file patterns must stay strict and
              portable, so the forgiving rules belong to the command line only, and every program built on
              the library must apply them identically instead of each inventing its own.
            children:
              - TextLint-FileSelection-CommandLinePathResolver-Separators
              - TextLint-FileSelection-CommandLinePathResolver-AbsolutePaths
              - TextLint-FileSelection-CommandLinePathResolver-ProbeFailure
              - TextLint-FileSelection-CommandLinePathResolver-Combination
              - TextLint-FileSelection-CommandLinePathResolver-Validation
              - TextLint-FileSelection-CommandLinePathResolver-ImmutableResult
            tests:
              - FileSelectionSubsystem_ResolveCommandLine_AbsolutePatternInsideRoot_SelectsAndHonorsIgnore
              - FileSelectionSubsystem_ResolveCommandLine_AbsolutePatternOutsideRoot_SelectsBeneathItsDirectory
              - FileSelectionSubsystem_ResolveCommandLine_BackslashRelativePath_FollowsPlatformRules
              - FileSelectionSubsystem_ResolveCommandLine_ExistingDirectory_SelectsEveryFileBelow

          - id: TextLint-FileSelection-CommandLineReporting
            title: >-
              The FileSelection subsystem shall let the caller name each selected file by absolute path when
              any command-line argument was absolute, and by relative path otherwise.
            justification: |
              A user who types a full path expects to see a full path in the output, and one who types a
              relative path expects a relative one; reports and the files they name must agree.
            children:
              - TextLint-FileSelection-CommandLinePathResolver-DisplayPath
            tests:
              - FileSelectionSubsystem_ResolveCommandLine_AbsolutePatternOutsideRoot_SelectsBeneathItsDirectory
              - FileSelectionSubsystem_ResolveCommandLine_AbsolutePatternInsideRoot_SelectsAndHonorsIgnore
