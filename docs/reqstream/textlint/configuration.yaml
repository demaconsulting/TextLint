---
# Configuration Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the TextLint Configuration subsystem
# - The Configuration subsystem turns a .textlint.yaml file, or values built in code, into one
#   immutable settings value, and reports every configuration problem as data
# - Subsystem requirements decompose the system requirements for settings; they are validated by
#   ConfigurationSubsystemTests.cs

sections:
  - title: TextLint Requirements
    sections:
      - title: Configuration Requirements
        requirements:
          - id: TextLint-Configuration-FileLoading
            title: >-
              The Configuration subsystem shall load a settings file asynchronously and return
              either settings or the errors that prevented them.
            justification: |
              Settings files are read from disk, which may be slow or fail, so loading must not
              block the caller and must report a missing or unreadable file the same way as any
              other configuration problem, so that one code path handles every failure.
            children:
              - TextLint-Configuration-SettingsLoader-ReadFile
            tests:
              - ConfigurationSubsystem_LoadAsync_ValidFile_ReturnsSettings
              - ConfigurationSubsystem_LoadAsync_MissingFile_ReturnsErrorDiagnostic

          - id: TextLint-Configuration-KeyMapping
            title: >-
              The Configuration subsystem shall map the supported cspell-named keys (version,
              files, ignorePaths, enableGlobDot, language, words, ignoreWords, flagWords,
              minWordLength, maxFileSize, ignoreRegExpList, patterns, ignoreRandomStrings, and
              minRandomLength) and the enabled and overrides keys onto settings, using defaults for
              absent keys.
            justification: |
              These keys are the cspell keys needed to select files and to tune the spell check,
              and a user migrating from cspell expects them to keep their meaning. An empty file
              must be valid so a project can start without configuration, and a project that sets
              neither enabled nor overrides must be checked as it was before they existed.
            children:
              - TextLint-Configuration-SettingsLoader-MapKeys
              - TextLint-Configuration-SettingsLoader-MapSpellingKeys
              - TextLint-Configuration-TextLintSettings-Defaults
              - TextLint-Configuration-TextLintSettings-SpellingDefaults
              - TextLint-Configuration-TextLintSettings-OverrideDefaults
            tests:
              - ConfigurationSubsystem_LoadAsync_AllSupportedKeys_PopulatesSettings
              - ConfigurationSubsystem_LoadAsync_EmptyFile_ReturnsDefaults
              - ConfigurationSubsystem_LoadAsync_OverridesAndEnabled_PopulatesSettings

          - id: TextLint-Configuration-EnabledSetting
            title: >-
              The Configuration subsystem shall let the settings switch checking off as a whole with the
              enabled key, shall treat settings as enabled when it is absent, and shall report a value that
              is not true or false as an error at the value.
            justification: |
              A project sometimes needs to pause every check, for example during a migration, without
              deleting its settings. The switch must be explicit and must not guess what an unrecognized
              value means.
            children:
              - TextLint-Configuration-SettingsLoader-MapEnabled
              - TextLint-Configuration-TextLintSettings-OverrideDefaults
              - TextLint-Configuration-TextLintSettings-Overrides
            tests:
              - ConfigurationSubsystem_LoadAsync_OverridesAndEnabled_PopulatesSettings

          - id: TextLint-Configuration-OrderedFiles
            title: >-
              The Configuration subsystem shall keep the patterns of the files setting in the order written,
              including those that begin with !, and shall report a files list that begins with !, and a !
              in ignorePaths, as an error at that pattern, with advice for the second.
            justification: |
              The order of the files list is its meaning, so it must reach the file selection unchanged, and
              a negation that has nothing to remove, or that tries to re-include files from the hard fence of
              ignorePaths, can only be a mistake that is best reported when the file is loaded, at its line
              and column.
            children:
              - TextLint-Configuration-SettingsLoader-OrderedPatterns
              - TextLint-Configuration-SettingsLoader-InvalidPatterns
            tests:
              - ConfigurationSubsystem_LoadAsync_OverridesAndEnabled_PopulatesSettings
              - ConfigurationSubsystem_LoadAsync_InvalidPattern_ReportsErrorWithPosition
              - ConfigurationSubsystem_LoadAsync_NegatedIgnorePath_ReportsErrorWithPosition

          - id: TextLint-Configuration-Overrides
            title: >-
              The Configuration subsystem shall load the overrides of a settings file as an ordered list,
              each with the filename patterns that choose its files and the spelling settings that apply to
              them, recording where each override is written, and shall keep the overrides unchangeable once
              settings are created.
            justification: |
              Different files need different rules, such as another language for one folder or extra words
              for the documentation. The position of each override lets later messages point at it, and
              overrides that could change after the settings were handed over would let one part of a run
              alter what another part checks.
            children:
              - TextLint-Configuration-SettingsLoader-MapOverrides
              - TextLint-Configuration-TextLintSettings-Overrides
              - TextLint-Configuration-TextLintSettings-OverrideValues
            tests:
              - ConfigurationSubsystem_LoadAsync_OverridesAndEnabled_PopulatesSettings

          - id: TextLint-Configuration-OverrideErrors
            title: >-
              The Configuration subsystem shall report each mistake in an override, such as selecting files
              from it, giving rules to an override that is switched off, leaving it without any setting, or
              using a setting that an override does not support, as an error at the node that holds it,
              naming what to do instead, and shall not return settings.
            justification: |
              An override that is only partly understood would apply the wrong rules to the wrong files. The
              mistakes that are easy to make each have a better way to say what was meant, and showing each
              at its own line and column lets a file be fixed in one pass.
            children:
              - TextLint-Configuration-SettingsLoader-OverrideErrors
            tests:
              - ConfigurationSubsystem_LoadAsync_InvalidOverrides_ReportsErrorsWithPositions

          - id: TextLint-Configuration-OverrideResolution
            title: >-
              The Configuration subsystem shall work out which overrides of a settings value apply to a file
              from the file's path relative to the settings root, in the order the overrides are written, and
              shall merge them with the top-level settings so that lists add up, named patterns of the same name
              are replaced, the last override that sets a single value decides, a language given by the caller
              wins, and a file switched off by the last matching override that sets enabled is reported as such.
            justification: |
              Which rules apply to a file is a question about the settings alone, so it is answered once, where
              the settings are defined, and every consumer gets the same answer. Keeping the rule "general first,
              specific last" in one place lets a project predict the effect of its overrides, and a file outside
              the settings root must not pick up rules written for the files inside it.
            children:
              - TextLint-Configuration-SettingsOverrideResolver-Matching
              - TextLint-Configuration-SettingsOverrideResolver-ListMerge
              - TextLint-Configuration-SettingsOverrideResolver-ScalarMerge
              - TextLint-Configuration-SettingsOverrideResolver-PatternNames
              - TextLint-Configuration-SettingsOverrideResolver-Enabled
              - TextLint-Configuration-SettingsOverrideResolver-LanguagePrecedence
              - TextLint-Configuration-SettingsOverrideResolver-OutsideRoot
              - TextLint-Configuration-SettingsOverrideResolver-Caching
              - TextLint-Configuration-SettingsOverrideResolver-CheckerSettings
              - TextLint-Configuration-SettingsOverrideResolver-InvalidArguments
              - TextLint-Configuration-SettingsOverrideResolver-ConcurrentUse
            tests:
              - ConfigurationSubsystem_Resolve_OverridesLoadedFromFile_MatchAndMergeInOrder
          - id: TextLint-Configuration-PatternSettings
            title: >-
              The Configuration subsystem shall map the ignoreRegExpList, patterns,
              ignoreRandomStrings, and minRandomLength keys onto settings, using the cspell defaults
              for absent keys (no patterns, random strings ignored, and a minimum random length of
              40), and shall keep the pattern lists unchangeable once settings are created.
            justification: |
              Projects exclude text that is not prose with these settings, so they must reach the
              spell check with the meaning they have in cspell, and a project that sets none of
              them must get cspell's behavior.
            children:
              - TextLint-Configuration-SettingsLoader-MapPatternKeys
              - TextLint-Configuration-TextLintSettings-PatternDefaults
              - TextLint-Configuration-TextLintSettings-ListsImmutable
            tests:
              - ConfigurationSubsystem_LoadAsync_PatternKeys_PopulatesSettings
              - ConfigurationSubsystem_LoadAsync_NoPatternKeys_UsesCspellDefaults

          - id: TextLint-Configuration-InvalidRegularExpressions
            title: >-
              The Configuration subsystem shall report an ignoreRegExpList entry or pattern
              definition that cannot be used, and an invalid ignoreRandomStrings or minRandomLength,
              as an error at the position of the problem, naming it and the reason, and shall not
              return settings.
            justification: |
              A pattern that cannot work would exclude nothing or fail in the middle of a run.
              Reporting it when the file is loaded, at its line and column, lets the user fix it
              at once.
            children:
              - TextLint-Configuration-SettingsLoader-InvalidRegularExpressions
            tests:
              - ConfigurationSubsystem_LoadAsync_InvalidPatterns_ReportsEachWithPosition

          - id: TextLint-Configuration-SpellingSettings
            title: >-
              The Configuration subsystem shall map the language, words, ignoreWords, flagWords,
              minWordLength, and maxFileSize keys onto settings, using the cspell defaults for
              absent keys (language en, minimum word length 4, empty word lists, and no file size
              limit), and shall keep the word lists unchangeable once settings are created.
            justification: |
              The spell check is tuned with these settings, so they must reach it with the meaning
              they have in cspell, and a project that sets none of them must get cspell's behavior.
              Word lists that could be changed after the settings were handed over would let one
              part of a run alter what another part checks.
            children:
              - TextLint-Configuration-SettingsLoader-MapSpellingKeys
              - TextLint-Configuration-TextLintSettings-SpellingDefaults
              - TextLint-Configuration-TextLintSettings-ListsImmutable
            tests:
              - ConfigurationSubsystem_LoadAsync_SpellingKeys_PopulatesSettings
              - ConfigurationSubsystem_LoadAsync_SpellingKeysAbsent_UsesCspellDefaults
              - ConfigurationSubsystem_Settings_WordListsConstructedInCode_AreImmutable

          - id: TextLint-Configuration-InvalidSpellingValues
            title: >-
              The Configuration subsystem shall report an unsupported language, an unusable
              word-list entry, an invalid minimum word length, and an invalid maximum file size
              as errors at the value's position, naming the problem, and shall not return settings.
            justification: |
              A value that cannot work would otherwise have no effect: an entry that can never
              match a word, a language without dictionaries, or a size that means no limit by
              accident. Reporting it when the file is loaded, at its line and column and with the
              reason, lets the user fix it at once instead of wondering why a setting is ignored.
            children:
              - TextLint-Configuration-SettingsLoader-ValidateSpellingValues
            tests:
              - ConfigurationSubsystem_LoadAsync_UnsupportedLanguage_ReportsErrorWithPosition
              - ConfigurationSubsystem_LoadAsync_UnusableWordEntry_ReportsErrorWithPosition
              - ConfigurationSubsystem_LoadAsync_InvalidMinWordLength_ReportsErrorWithPosition
              - ConfigurationSubsystem_LoadAsync_InvalidMaxFileSize_ReportsErrorWithPosition
              - ConfigurationSubsystem_LoadAsync_MultipleSpellingErrors_ReportsAll

          - id: TextLint-Configuration-ProgrammaticSettings
            title: >-
              The Configuration subsystem shall provide immutable settings that applications
              construct and copy in code, and shall reject an out-of-range spelling value when
              the settings are constructed.
            justification: |
              Embedding applications, and a command line that overrides the configuration file,
              build settings without a file. Settings that could change after they were handed
              over would make a lint run depend on hidden shared state, and a value that is
              out of range is a programming error that must surface where it is made.
            children:
              - TextLint-Configuration-TextLintSettings-Immutable
              - TextLint-Configuration-TextLintSettings-Defaults
              - TextLint-Configuration-TextLintSettings-ValueValidation
            tests:
              - ConfigurationSubsystem_Settings_ConstructedInCode_IsImmutable
              - ConfigurationSubsystem_Settings_LoadedThenCopied_LeavesLoadedUnchanged
              - ConfigurationSubsystem_Settings_SpellingValuesOutOfRange_AreRejected

          - id: TextLint-Configuration-ErrorReporting
            title: >-
              The Configuration subsystem shall report every configuration error with its file,
              line, and column.
            justification: |
              Users must be able to locate and fix every problem in a settings file from the
              report alone, and fixing them one run at a time is needlessly slow.
            children:
              - TextLint-Configuration-SettingsLoader-SyntaxErrors
              - TextLint-Configuration-SettingsLoader-TypeErrors
              - TextLint-Configuration-SettingsLoader-Diagnostics
            tests:
              - ConfigurationSubsystem_LoadAsync_MalformedYaml_ReportsPosition
              - ConfigurationSubsystem_LoadAsync_MultipleTypeErrors_ReportsAll

          - id: TextLint-Configuration-UnsupportedKeys
            title: >-
              The Configuration subsystem shall report an unsupported key as an error naming the
              key and its position, and shall not return settings.
            justification: |
              A key the user believes is in force but that has no effect is a silent
              misconfiguration. Failing loudly with the key's name tells the user precisely which
              setting is not available.
            children:
              - TextLint-Configuration-SettingsLoader-UnsupportedKeys
            tests:
              - ConfigurationSubsystem_LoadAsync_UnsupportedKey_ReportsErrorWithKeyAndPosition

          - id: TextLint-Configuration-InvalidPatterns
            title: >-
              The Configuration subsystem shall report an unsupported or malformed glob pattern as
              an error at the pattern's position.
            justification: |
              A bad pattern is a configuration problem, so it is best reported when the file is
              loaded, at the line and column of the offending entry, rather than later when the
              files are selected and the position is lost.
            children:
              - TextLint-Configuration-SettingsLoader-InvalidPatterns
            tests:
              - ConfigurationSubsystem_LoadAsync_InvalidPattern_ReportsErrorWithPosition
              - ConfigurationSubsystem_LoadAsync_AbsolutePathPattern_ReportsErrorWithPosition
