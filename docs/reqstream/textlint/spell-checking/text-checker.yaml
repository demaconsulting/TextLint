---
# Software Unit Requirements for the TextChecker Class
#
# The TextChecker class checks the spelling of a string of text against the dictionary of the configured language
# and the word lists of a settings value, and returns each finding with its position. The SpellingIssue and
# SpellingIssueKind types that carry the findings, and the internal word-list types, belong to this unit.

sections:
  - title: TextLint Requirements
    sections:
      - title: SpellChecking Requirements
        sections:
          - title: TextChecker Requirements
            requirements:
              - id: TextLint-SpellChecking-TextChecker-UnknownWords
                title: >-
                  TextChecker shall report each unknown word of a text as a finding that carries the source
                  name, the line, the column, and the word, report nothing for an empty text or for a text
                  of known words, and reject a null text.
                justification: |
                  This is the core behavior of the checker and the basis of every other rule: a finding is
                  useful only if it names the word and where it is, and hostile input such as an enormous
                  word or a lone surrogate must not stop the check.
                tests:
                  - TextChecker_Check_UnknownWord_ReportsWordAtPosition
                  - TextChecker_Check_KnownWords_ReportsNothing
                  - TextChecker_Check_EmptyText_ReturnsEmpty
                  - TextChecker_Check_WhiteSpaceAndPunctuationOnly_ReturnsEmpty
                  - TextChecker_Check_SourceName_IsCopiedToFindings
                  - TextChecker_Check_NoSourceName_LeavesFilePathNull
                  - TextChecker_Check_NullText_ThrowsArgumentNullException
                  - TextChecker_Check_Result_IsImmutable
                  - TextChecker_Check_VeryLongWord_IsReportedOnce
                  - TextChecker_Check_LoneSurrogate_ReportsFollowingWord

              - id: TextLint-SpellChecking-TextChecker-WordSplitting
                title: >-
                  TextChecker shall check a word as a whole before splitting it, so that a known compound
                  identifier is not taken apart, and shall split an unknown identifier at case changes,
                  digits, underscores, hyphens, and other punctuation, keeping apostrophes inside words,
                  and report only the pieces that are unknown.
                justification: |
                  Source code is full of identifiers such as fooBar_baz. A user expects the unknown piece
                  to be reported, not the whole identifier, and a compound that the dictionary or the word
                  lists know must stay quiet. cspell behaves this way, so migrated projects stay quiet where
                  they were quiet.
                tests:
                  - TextChecker_Check_KnownCompoundIdentifier_IsNotSplit
                  - TextChecker_Check_UnknownCamelCase_ReportsOnlyUnknownPieces
                  - TextChecker_Check_SnakeCase_ReportsEachUnknownWord
                  - TextChecker_Check_DigitsBetweenWords_SeparateWords
                  - TextChecker_Check_HyphenatedWords_AreCheckedSeparately
                  - TextChecker_Check_AcronymBeforeWord_SplitsAtTheLastCapital
                  - TextChecker_Check_LowerCaseConcatenation_IsReportedWhole
                  - TextChecker_Check_ApostropheWord_StaysWhole

              - id: TextLint-SpellChecking-TextChecker-KnownWordForms
                title: >-
                  TextChecker shall accept the possessive of a known word, with a straight or a typographic
                  apostrophe, a known word that follows a backslash escape, and a run of capitals with a
                  plural or verb ending whose capitals are known or too short to check, and shall never
                  report a word that is one letter repeated four or more times.
                justification: |
                  Without these allowances prose such as "the parser's output", string literals such as
                  "\nfoo", acronyms such as URLs, and placeholders such as xxxx produce findings that cspell
                  does not, which would make a migrated project noisy and the findings untrustworthy.
                tests:
                  - TextChecker_Check_PossessiveOfKnownWord_IsAccepted
                  - TextChecker_Check_PossessiveOfUnknownWord_IsReported
                  - TextChecker_Check_WordAfterBackslashEscape_IsAccepted
                  - TextChecker_Check_UnknownWordAfterBackslashEscape_IsReported
                  - TextChecker_Check_LetterPrefixWithoutBackslash_IsReported
                  - TextChecker_Check_CapitalRunWithEnding_IsAccepted
                  - TextChecker_Check_ShortCapitalRunWithEnding_IsAccepted
                  - TextChecker_Check_UnknownCapitalRunWithEnding_IsReported
                  - TextChecker_Check_RepeatedLetters_AreNeverReported
                  - TextChecker_Check_ThreeRepeatedLettersAtLowMinimum_AreReported

              - id: TextLint-SpellChecking-TextChecker-MinimumWordLength
                title: >-
                  TextChecker shall not check a word, or a piece of an identifier, that is shorter than the
                  minimum word length of the settings, counted in UTF-16 code units, and shall check a word
                  that has exactly that length.
                justification: |
                  The minimum length tunes how noisy the checker is: short abbreviations and variable names
                  are quiet at the default and a project can raise or lower the limit. Counting UTF-16 code
                  units is what cspell does, so the same limit gives the same findings.
                tests:
                  - TextChecker_Check_WordShorterThanMinimum_IsNotChecked
                  - TextChecker_Check_WordAtMinimumLength_IsChecked
                  - TextChecker_Check_MinimumLengthRaised_SkipsShorterWords
                  - TextChecker_Check_MinimumLengthLowered_ChecksShorterWords
                  - TextChecker_Check_MinimumLength_CountsUtf16Units
                  - TextChecker_Check_ShortPieceOfUnknownWord_IsNotReported

              - id: TextLint-SpellChecking-TextChecker-WordListPrecedence
                title: >-
                  TextChecker shall accept the words of the words and ignoreWords settings in any letter
                  case, match an entry that contains digits or punctuation against the whole token, and
                  apply the order ignored, then flagged, then accepted, then dictionary.
                justification: |
                  Every project has a vocabulary of its own. cspell users expect an ignored word never to
                  be reported, a flagged word always to be, and an entry written in one letter case to
                  match any case, so the same configuration must give the same answers here.
                tests:
                  - TextChecker_Check_WordsEntry_AcceptsAnyCase
                  - TextChecker_Check_WordsEntryWithCapital_AcceptsAnyCase
                  - TextChecker_Check_IgnoreWordsEntry_IsNotReported
                  - TextChecker_Check_WordBothIgnoredAndFlagged_IsNotReported
                  - TextChecker_Check_WordBothAcceptedAndFlagged_IsReported
                  - TextChecker_Check_KnownWordThatIsFlagged_IsReported
                  - TextChecker_Check_WordsEntryWithDigits_MatchesWholeToken
                  - TextChecker_Check_IgnoreEntryWithPunctuation_MatchesWholeToken

              - id: TextLint-SpellChecking-TextChecker-FlaggedWords
                title: >-
                  TextChecker shall report a word of the flagWords setting as a flagged word, with the
                  suggestions of its entry, whatever its length, match an entry written in lower case in any
                  letter case and an entry with a capital letter only in that spelling, and report a
                  flagged entry that contains digits or punctuation as one finding for the whole token.
                justification: |
                  Projects forbid terms, and a forbidden term must be reported even when the dictionary
                  knows it and even when it is short. The suggestion forms let a finding say what to write
                  instead, and the case rule matches cspell so that migrated flag lists behave the same.
                tests:
                  - TextChecker_Check_FlagWords_ReportsFlaggedKind
                  - TextChecker_Check_FlagEntryWithArrow_ReportsSuggestions
                  - TextChecker_Check_FlagEntryWithColon_ReportsSuggestion
                  - TextChecker_Check_FlaggedWordShorterThanMinimum_IsStillReported
                  - TextChecker_Check_FlagEntryInLowerCase_MatchesAnyCase
                  - TextChecker_Check_FlagEntryWithCapital_MatchesOnlyThatSpelling
                  - TextChecker_Check_FlaggedPieceOfIdentifier_IsReportedAsFlagged
                  - TextChecker_Check_FlagEntryWithDigits_ReportsWholeToken

              - id: TextLint-SpellChecking-TextChecker-Language
                title: >-
                  TextChecker shall use the language setting to choose the dictionary, so that a spelling
                  of one dialect is reported under another, and shall accept the spellings of every
                  language in a list of languages.
                justification: |
                  A word that is correct in American English (favorite) is a mistake in British English and
                  the reverse, so the language setting must change the result.
                tests:
                  - TextChecker_Check_DefaultLanguage_RejectsBritishSpelling
                  - TextChecker_Check_BritishLanguage_AcceptsBritishNotAmericanSpelling
                  - TextChecker_Check_BothLanguages_AcceptEitherSpelling

              - id: TextLint-SpellChecking-TextChecker-IssuePositions
                title: >-
                  TextChecker shall report positions that count lines by the line feed character only and
                  columns in UTF-16 code units from the start of the line, both starting at one, so that a
                  carriage return alone is not a line break, a character outside the Basic Multilingual
                  Plane counts as two columns, and a byte order mark character counts as one.
                justification: |
                  A finding is useful only if its position is the position a user sees in an editor, and
                  cspell counts this way, so recorded positions from cspell stay valid.
                tests:
                  - TextChecker_Check_LineFeed_StartsNewLine
                  - TextChecker_Check_CarriageReturnLineFeed_CountsOneLineBreak
                  - TextChecker_Check_LoneCarriageReturn_IsNotLineBreak
                  - TextChecker_Check_LineSeparatorCharacter_IsNotLineBreak
                  - TextChecker_Check_AstralCharacter_CountsTwoColumns
                  - TextChecker_Check_ByteOrderMarkCharacter_CountsOneColumn
                  - TextChecker_Check_Tab_CountsOneColumn
                  - TextChecker_Check_ManyLines_CountsLinesExactly

              - id: TextLint-SpellChecking-TextChecker-IssueOrder
                title: >-
                  TextChecker shall return its findings in text order, including the findings for
                  unsupported directives, which belong at the position where the directive is written.
                justification: |
                  Editors and build logs present findings top to bottom, and a stable order makes results
                  reproducible and comparable between runs.
                tests:
                  - TextChecker_Check_SeveralFindings_AreInTextOrder
                  - TextChecker_Check_UnsupportedDirectiveBetweenWords_IsInTextOrder
                  - TextChecker_Check_UnsupportedDirectiveBeforeWords_IsReportedFirst

              - id: TextLint-SpellChecking-TextChecker-Directives
                title: >-
                  TextChecker shall honor the directives in a text: switch checking off for a region, for a
                  line, and for the next line, add the listed words for the whole document without
                  affecting any other text, accept the directive prefixes in any letter case, and report a
                  directive that is not supported at its position unless checking is switched off there.
                justification: |
                  Directives in comments are how cspell users silence deliberate exceptions next to the
                  text that needs them, and a directive that silently did nothing would hide a difference
                  from cspell. Words added for one document must not leak into the next one.
                tests:
                  - TextChecker_Check_DisableEnableBlock_SkipsRegion
                  - TextChecker_Check_UnterminatedDisable_RunsToEndOfText
                  - TextChecker_Check_DisableLine_SkipsLine
                  - TextChecker_Check_DisableNextLine_SkipsNextLine
                  - TextChecker_Check_WordsDirective_AcceptsWordsInWholeDocument
                  - TextChecker_Check_IgnoreDirective_AcceptsListedWords
                  - TextChecker_Check_DocumentWords_DoNotLeakToNextCall
                  - TextChecker_Check_DirectivePrefixInUpperCase_IsAccepted
                  - TextChecker_Check_CspellPrefix_IsAccepted
                  - TextChecker_Check_UnsupportedDirective_ReportsKindAndPosition
                  - TextChecker_Check_UnsupportedDirectiveInDisabledRegion_IsNotReported

              - id: TextLint-SpellChecking-TextChecker-IgnoredText
                title: >-
                  TextChecker shall not check URLs, email addresses, hexadecimal values, UUIDs, and hashes,
                  shall still check the text on either side of them, and shall check a word that such text
                  cuts in two as separate pieces.
                justification: |
                  These strings are never prose and their fragments would bury real findings, but the words
                  around them are prose and must still be checked. cspell ignores them by default, so a
                  migrated project must find them ignored here too.
                tests:
                  - TextChecker_Check_UrlEmailAndHash_AreNotChecked
                  - TextChecker_Check_Uuid_IsNotChecked
                  - TextChecker_Check_TextAroundExcludedRange_IsStillChecked
                  - TextChecker_Check_WordSplitByExcludedRange_IsCheckedAsSeparateSegments

              - id: TextLint-SpellChecking-TextChecker-InvalidSettings
                title: >-
                  TextChecker shall reject null settings, an unsupported language, and a word-list entry
                  that could never match, because it is blank, contains white space or a character that
                  cannot be part of a word, begins with the forbidden-word marker, or has no letter or
                  digit, with an error that names the language, or the setting and the entry.
                justification: |
                  Settings built in code bypass the checks of the settings file loader, and an entry that
                  can never match would give a setting the user believes is in force no effect. Failing at
                  once with the name of the entry is the only way the user can find it.
                tests:
                  - TextChecker_Constructor_NullSettings_ThrowsArgumentNullException
                  - TextChecker_Constructor_UnsupportedLanguage_ThrowsNamingLanguage
                  - TextChecker_Constructor_UnsupportedLanguageAndBadEntry_ReportsLanguage
                  - TextChecker_Constructor_BlankEntry_ThrowsNamingSetting
                  - TextChecker_Constructor_WhiteSpaceEntry_ThrowsNamingSettingAndEntry
                  - TextChecker_Constructor_ForbiddenMarkerEntry_ThrowsNamingSettingAndEntry
                  - TextChecker_Constructor_DisallowedCharacterEntry_ThrowsNamingSettingAndEntry
                  - TextChecker_Constructor_EntryWithoutLetterOrDigit_ThrowsNamingSettingAndEntry
                  - TextChecker_Constructor_FlagEntryWithoutWord_ThrowsNamingSetting
                  - TextChecker_Constructor_SuggestionFormInWords_ThrowsNamingSetting

              - id: TextLint-SpellChecking-TextChecker-ConcurrentUse
                title: >-
                  TextChecker shall give identical findings when one checker is used by several threads at
                  the same time, and shall keep no state from one check to the next.
                justification: |
                  Files are checked in parallel with one checker, so a result that depended on what another
                  thread was checking, or on an earlier text, would not be reproducible.
                tests:
                  - TextChecker_Check_ConcurrentCalls_GiveIdenticalResults
                  - TextChecker_Check_DocumentWords_DoNotLeakToNextCall

              - id: TextLint-SpellChecking-TextChecker-IssueFormat
                title: >-
                  TextChecker shall return findings that expose their file name, line, column, text, kind,
                  and suggestions, cannot be changed by the caller, and are formatted as
                  file(line,column): error: message, with the suggestions in the message and with only the
                  position when there is no file name.
                justification: |
                  The compiler style is understood by editors, build servers, and CI log parsers, so
                  findings become clickable without any tool-specific integration, and a finding that a
                  consumer could change would not be a trustworthy record.
                tests:
                  - TextChecker_Check_Issue_ExposesAllProperties
                  - TextChecker_Check_IssueWithFileName_FormatsCompilerStyle
                  - TextChecker_Check_IssueWithoutFileName_FormatsPositionOnly
                  - TextChecker_Check_FlaggedIssueWithSuggestions_FormatsSuggestions
                  - TextChecker_Check_UnsupportedDirectiveIssue_FormatsDirectiveMessage
                  - TextChecker_Check_IssueSuggestions_AreImmutable

              - id: TextLint-SpellChecking-TextChecker-IssueFileName
                title: >-
                  TextChecker shall let a caller format a finding under a file name of the caller's choosing,
                  in the same compiler style as the finding's own formatting.
                justification: |
                  A finding records the path relative to the root directory, but a user who typed an absolute
                  path expects to see that path in the output. Letting the caller choose the name keeps the
                  message wording and position format in one place instead of copied into every consumer.
                tests:
                  - TextChecker_Format_CallerFileName_ReplacesRecordedFileName

              - id: TextLint-SpellChecking-TextChecker-CustomPatterns
                title: >-
                  TextChecker shall not check the text that matches the patterns of the ignoreRegExpList and
                  patterns settings, in addition to the default ignore list, shall apply a pattern to the whole
                  text so that it can span lines and cut a word in two, shall check the text around a match, and
                  shall change nothing when a pattern matches nothing or only the empty string.
                justification: |
                  Projects hold text that is not prose and that the defaults do not recognize, such as encoded
                  fixtures and identifiers of a naming scheme. cspell users exclude it with these patterns, and a
                  migrated project must find it excluded here too, with the text around the match still checked.
                tests:
                  - TextChecker_Check_IgnoreRegExpListExpression_SkipsMatches
                  - TextChecker_Check_IgnoreRegExpListNames_ApplyNamedAndPredefinedPatterns
                  - TextChecker_Check_PatternSpanningLinesAndCuttingAWord_ExcludesOnlyTheMatch
                  - TextChecker_Check_PatternMatchingEmptyText_ExcludesOnlyRealMatches
                  - TextChecker_Check_CustomPatterns_AreAddedToTheDefaultPatterns
                  - TextChecker_Check_PatternWithoutMatch_ChangesNothing

              - id: TextLint-SpellChecking-TextChecker-InvalidPatterns
                title: >-
                  TextChecker shall reject settings with a pattern that cannot be used (an unsupported flag or
                  construct, an invalid regular expression, an unknown, predefined, malformed, or repeated name),
                  with an error that names the entry and the reason.
                justification: |
                  Settings built in code bypass the checks of the settings file loader, and a pattern that could
                  never work would give a setting the user believes is in force no effect. Failing when the checker
                  is created, with the entry named, is the only way the user can find the mistake.
                tests:
                  - TextChecker_Constructor_InvalidIgnoreRegExpListEntry_ThrowsInvalidPatternException
                  - TextChecker_Constructor_InvalidNamedPatterns_ThrowInvalidPatternException

              - id: TextLint-SpellChecking-TextChecker-PatternTimeout
                title: >-
                  TextChecker shall stop checking a text and throw the time-out exception of the regular
                  expression engine when one of its patterns, from the settings or from a directive of the
                  text, exceeds five seconds on the text (a shorter limit is available through an internal
                  seam for tests), so that the caller can treat the text as not checked, and shall reject a
                  limit that is not positive.
                justification: |
                  A pattern of the settings, or of a directive written by whoever wrote the text, can backtrack
                  catastrophically on a file built to make it. A run that never finishes is worse than one that
                  reports the file as not checked. The seam lets the tests prove it in milliseconds.
                tests:
                  - TextChecker_Check_CatastrophicCustomPattern_ThrowsRegexMatchTimeoutException
                  - TextChecker_Check_CatastrophicDirectivePattern_ThrowsRegexMatchTimeoutException
                  - TextChecker_New_MatchTimeout_IsFiveSecondsAndMustBePositive

              - id: TextLint-SpellChecking-TextChecker-IgnoreRegExpDirective
                title: >-
                  TextChecker shall exclude from checking the text that matches the pattern of an ignoreRegExp
                  directive, anywhere in the text it is written in, resolving the pattern like an
                  ignoreRegExpList entry (a literal with the flags written, a bare expression, a pattern of the
                  settings by name, or a predefined name), shall report a pattern that cannot be used as an
                  invalid directive at the pattern, with the reason, unless checking is switched off there, shall
                  report an ignoreRegExp directive with no pattern as an unsupported directive, shall put these
                  reports in text order with the other findings, shall read each different pattern once however
                  many directives repeat it (names that differ only in letter case are one pattern, as they are
                  for the lookup of the name), and shall accept at most 32 different patterns in one text,
                  reporting the excess without reading it.
                justification: |
                  A project migrated from cspell relies on the directive to hide text that is not prose. cspell
                  silently drops a pattern it cannot use, so the author would believe it is in force, and the
                  report tells them where it is not. The directives of a text are written by whoever wrote the
                  text, so the work they cause is bounded by the number of patterns and the time limit of each.
                tests:
                  - TextChecker_Check_IgnoreRegExpDirective_HidesMatchesInTheWholeText
                  - TextChecker_Check_IgnoreRegExpDirectiveForms_UseTheFlagsAsWritten
                  - TextChecker_Check_IgnoreRegExpDirectiveNames_RefersToSettingsAndPredefinedPatterns
                  - TextChecker_Check_IgnoreRegExpDirectiveInvalid_IsReportedAtItsPosition
                  - TextChecker_Check_IgnoreRegExpDirectiveUnknownName_IsReportedAndHidesNothing
                  - TextChecker_Check_IgnoreRegExpDirectiveInDisabledBlock_AppliesButIsNotReported
                  - TextChecker_Check_IgnoreRegExpDirectiveRepeated_IsReportedAtEachPlaceInOrder
                  - TextChecker_Check_IgnoreRegExpDirectiveWithoutPattern_IsReportedAsUnsupported
                  - TextChecker_Check_IgnoreRegExpDirectivePatternLimit_RejectsTheExcessWithoutReadingIt
                  - TextChecker_Check_IgnoreRegExpDirectiveNamesDifferingInCase_CountOnceTowardsTheLimit
                  - TextChecker_Check_IgnoreRegExpDirectiveExpressionsDifferingInCase_CountSeparatelyTowardsTheLimit

              - id: TextLint-SpellChecking-TextChecker-MarkdownFiles
                title: >-
                  TextChecker shall not check the targets of links, the labels of reference links, the definitions
                  of references, the ids of anchors, and the HTML entities of a text whose source name has a
                  Markdown extension, and shall check them in a text with another name or with no name.
                justification: |
                  Link targets and labels are names and addresses, and their fragments would be reported as unknown
                  words in every document. cspell excludes them in Markdown files only, and the name of the source
                  is what tells the checker which kind of file it has.
                tests:
                  - TextChecker_Check_MarkdownFile_SkipsLinkTargetsLabelsAnchorsAndEntities
                  - TextChecker_Check_NoSourceName_DoesNotApplyMarkdownPatterns

              - id: TextLint-SpellChecking-TextChecker-RandomStrings
                title: >-
                  TextChecker shall not check a token of at least minRandomLength characters that looks like
                  random data, even when a flagged word is inside it, and shall not report the unknown words that
                  lie inside a hexadecimal sequence of a token unless they are flagged, when ignoreRandomStrings is
                  on, shall check them when it is off or the token is shorter than minRandomLength, and shall
                  still check long identifiers made of words.
                justification: |
                  Keys, tokens, and partial UUIDs are made of fragments that no dictionary knows, and cspell skips
                  them by default. The switch and the length let a project that wants every token checked have that,
                  as they do in cspell.
                tests:
                  - TextChecker_Check_LongRandomLookingToken_IsSkipped
                  - TextChecker_Check_RandomLookingTokenWhenNotSkipped_IsCheckedAsWords
                  - TextChecker_Check_LongIdentifierOfWords_IsStillChecked
                  - TextChecker_Check_FlaggedWordInsideRandomLookingToken_IsNotReported
                  - TextChecker_Check_WordsInsideHexSequence_AreNotReported
                  - TextChecker_Check_MixedCaseHexSequenceOrFlaggedWord_StaysReported

              - id: TextLint-SpellChecking-TextChecker-Contractions
                title: >-
                  TextChecker shall accept a word with apostrophes when every part between the apostrophes is
                  known, is a run of capitals with an ending whose capitals are known, or is shorter than the
                  minimum word length, treating the first part as following a backslash when the word does, and
                  shall report the whole word, with its apostrophes, when some part is unknown, flagged, or long
                  enough to be checked.
                justification: |
                  Programmers write contractions such as exec'd, OR'd, and rock'n'roll, and cspell accepts them
                  when their parts are acceptable. Without the rule every such word is a false finding, and with
                  a rule that was too lenient a misspelled part would hide.
                tests:
                  - TextChecker_Check_ContractionOfAcceptableParts_IsAccepted
                  - TextChecker_Check_ContractionWithUnknownPart_IsReportedWhole
                  - TextChecker_Check_ContractionWithFlaggedOrCheckedPart_IsReported
                  - TextChecker_Check_ContractionAfterBackslash_RetriesWithoutEscapeLetter
