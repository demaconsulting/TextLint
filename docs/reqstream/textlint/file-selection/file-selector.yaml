---
# Software Unit Requirements for the FileSelector Class
#
# The FileSelector class applies include and ignore glob patterns to a root directory and returns the ordered list of
# files to check. The include patterns form an ordered list in which a pattern that begins with ! excludes; the
# ignore patterns do not accept !.

sections:
  - title: TextLint Requirements
    sections:
      - title: FileSelection Requirements
        sections:
          - title: FileSelector Requirements
            requirements:
              - id: TextLint-FileSelection-FileSelector-Matching
                title: >-
                  FileSelector shall return the files under the root that match an include pattern
                  and no ignore pattern, select nothing when there are no include patterns, and
                  report a root that is missing differently from one that cannot be read.
                justification: |
                  This is the core selection behavior: includes choose, ignores win, and an empty
                  configuration selects nothing rather than everything. A missing root is a caller
                  error that must be reported, not treated as an empty result, and a root the process
                  may not read must not be mistaken for a missing one, because the remedy differs.
                tests:
                  - FileSelector_Select_IncludePatterns_ReturnsMatchingFiles
                  - FileSelector_Select_IgnorePatterns_ExcludesMatches
                  - FileSelector_Select_NoIncludePatterns_ReturnsEmpty
                  - FileSelector_Select_IgnoreAndIncludeOverlap_IgnoreWins
                  - FileSelector_Select_NestedFiles_AreFound
                  - FileSelector_Select_NamesWithSpaces_AreSelected
                  - FileSelector_Select_BareDirectoryNameIgnored_ExcludesNestedSubtree
                  - FileSelector_Select_RootDirectoryMissing_ThrowsDirectoryNotFound
                  - FileSelector_Select_RootDirectoryMissingNoIncludes_ThrowsDirectoryNotFound
                  - FileSelector_Select_RootIsFile_ThrowsIOException
                  - FileSelector_Select_EmptyRootDirectory_ReturnsEmpty
                  - FileSelector_ProbeRoot_DirectoryNotFound_ThrowsDirectoryNotFoundNamingRoot
                  - FileSelector_ProbeRoot_AccessDenied_PropagatesUnauthorizedAccess
                  - FileSelector_ProbeRoot_LazyListingFails_PropagatesIOException
                  - FileSelector_ProbeRoot_NullArguments_ThrowsArgumentNullException
                  - FileSelector_Select_NullIncludePatterns_ThrowsArgumentNullException
                  - FileSelector_Select_NullIgnorePatterns_ThrowsArgumentNullException
                  - FileSelector_Select_NullRoot_ThrowsArgumentNullException
                  - FileSelector_Select_EmptyRoot_ThrowsArgumentException
                  - FileSelector_Select_Result_ExposesFullPath
                  - FileSelector_Select_LeadingSlashPattern_MatchesOnlyAtRoot

              - id: TextLint-FileSelection-FileSelector-CaseSensitive
                title: FileSelector shall match patterns case-sensitively on every platform.
                justification: |
                  A configuration must select the same files on Windows, Linux, and macOS; the
                  file systems differ in case sensitivity, so matching must not follow them.
                tests:
                  - FileSelector_Select_DifferentCaseExtension_IsNotSelected
                  - FileSelector_Select_DifferentCaseDirectory_IsNotSelected

              - id: TextLint-FileSelection-FileSelector-HiddenFiles
                title: >-
                  FileSelector shall not let wildcards select hidden files and directories unless
                  hidden-file matching is enabled, and shall select hidden names a pattern writes
                  literally.
                justification: |
                  Matches the cspell rule: wildcards skip dot-prefixed names by default, an
                  explicit pattern such as .github/** still works, and enabling hidden matching
                  lets wildcards reach everything.
                tests:
                  - FileSelector_Select_HiddenFile_SkippedByDefault
                  - FileSelector_Select_HiddenDirectory_SkippedByDefault
                  - FileSelector_Select_HiddenEntries_SelectedWhenGlobDotEnabled
                  - FileSelector_Select_LiteralHiddenDirectoryPattern_SelectsFilesBeneath
                  - FileSelector_Select_LiteralHiddenFilePattern_SelectsFileAtAnyDepth
                  - FileSelector_Select_WildcardBeneathLiteralHidden_SkipsNestedHidden
                  - FileSelector_Select_LiteralInOtherPattern_DoesNotLetWildcardReachHidden

              - id: TextLint-FileSelection-FileSelector-PrunedTraversal
                title: >-
                  FileSelector shall not enumerate a directory that an ignore pattern excludes, or
                  a hidden directory that no include pattern names, but shall enumerate a hidden
                  directory that an include pattern names.
                justification: |
                  Large excluded trees dominate run time if they are read; the test double
                  observes enumeration directly so the property is proven without timing.
                tests:
                  - FileSelector_Select_IgnoredDirectory_IsNeverEnumerated
                  - FileSelector_Select_HiddenDirectory_IsNeverEnumeratedByDefault
                  - FileSelector_Select_NestedIgnoredDirectory_IsNeverEnumerated
                  - FileSelector_Select_LiteralHiddenDirectory_IsEnumerated

              - id: TextLint-FileSelection-FileSelector-OrderedIncludes
                title: >-
                  FileSelector shall apply the include patterns as an ordered list in which a pattern that
                  begins with ! removes the files it matches from those that earlier patterns selected and a
                  later pattern can select them again, so that the last matching pattern decides, shall let a
                  negated pattern remove hidden files when hidden-file matching is enabled, and shall let the
                  ignore patterns win over the whole list.
                justification: |
                  Settings need to say "all Markdown files except those under docs, but the docs/keep folder
                  stays in" without listing files. The ordered list is the form ReviewMark and ignore files
                  already teach, and the ignore patterns remain the hard fence that nothing can re-include.
                tests:
                  - FileSelector_Select_NegationAfterInclude_ExcludesFiles
                  - FileSelector_Select_IncludeAfterNegation_SelectsFilesAgain
                  - FileSelector_Select_NegationAndGlobDot_SelectsHiddenExceptNegated
                  - FileSelector_Select_IgnorePatternWithOrderedInclude_IgnoreStillWins
                  - FileSelector_Select_OrderedLists_MatchesExactRuleForEveryFile

              - id: TextLint-FileSelection-FileSelector-ListWithoutNegation
                title: >-
                  FileSelector shall select, for a list of include patterns without a negated pattern, exactly
                  the files that the same patterns select as plain includes.
                justification: |
                  Ordered matching is added to settings files that exist today. A list that does not use it
                  must keep selecting what it always selected, so that no project changes behavior by
                  upgrading.
                tests:
                  - FileSelector_Select_ListWithoutNegation_SelectsSameFilesAsBefore

              - id: TextLint-FileSelection-FileSelector-OrderedPruning
                title: >-
                  FileSelector shall not enumerate a directory whose files are all excluded by a negated
                  include pattern that no later pattern can undo, shall enumerate a directory that a later
                  pattern could select from, and shall enumerate a directory that a negated pattern naming only
                  files leaves open.
                justification: |
                  A negation that removes a vendored or generated tree must not cost the time of reading it,
                  but a directory that a later pattern brings back must still be read, or files would be lost;
                  the test double observes enumeration directly so both properties are proven without timing.
                tests:
                  - FileSelector_Select_NegatedBareDirectory_IsNotEnumerated
                  - FileSelector_Select_NegatedDirectoryWithLaterInclude_IsEnumerated
                  - FileSelector_Select_NegatedFilePattern_StillEnumeratesDirectory
                  - FileSelector_Select_NegationAndHiddenDirectory_HiddenIsNotEnumerated

              - id: TextLint-FileSelection-FileSelector-Cancellation
                title: >-
                  FileSelector shall stop and signal cancellation, without returning a partial selection,
                  when the caller's token is canceled before the call or while the directory tree is read,
                  and shall not list further directories once it is canceled.
                justification: |
                  The directory walk is the long part of a selection on a large tree. A token that is only
                  honored once the walk has ended would make canceling useless exactly when it matters. The
                  test double cancels the token at a chosen point of the walk, so the property is proven
                  without timing.
                tests:
                  - FileSelector_Select_TokenAlreadyCanceled_ThrowsOperationCanceled
                  - FileSelector_Select_CanceledDuringWalk_StopsWalkAndThrows
                  - FileSelector_Select_TokenNotCanceled_ReturnsSelection

              - id: TextLint-FileSelection-FileSelector-StableOrder
                title: >-
                  FileSelector shall order results by ordinal relative path and express relative
                  paths with forward slashes.
                justification: |
                  Reproducible output across platforms and runs is needed for reports, diffs, and
                  caches.
                tests:
                  - FileSelector_Select_FilesCreatedOutOfOrder_ReturnsOrdinalOrder
                  - FileSelector_Select_NestedFiles_UseForwardSlashes

              - id: TextLint-FileSelection-FileSelector-InvalidPatterns
                title: >-
                  FileSelector shall reject settings whose include or ignore patterns are
                  unsupported or malformed, including an include list that starts with a negated
                  pattern and an ignore pattern that is negated, with an error that names the
                  pattern, and shall do so before it reads the file system.
                justification: |
                  Settings built in code bypass the settings file check, so selection must
                  enforce the same pattern rules rather than silently select the wrong files.
                  An ignore pattern is a hard fence that cannot re-include files, so a negation
                  there can only be a mistake.
                tests:
                  - FileSelector_Select_InvalidIncludePattern_ThrowsInvalidGlobPattern
                  - FileSelector_Select_InvalidIgnorePattern_ThrowsInvalidGlobPattern
                  - FileSelector_Select_AbsolutePathPattern_ThrowsInvalidGlobPattern
                  - FileSelector_Select_IgnorePatternWithOrderedInclude_IgnoreStillWins
                  - FileSelector_Select_LeadingNegationAndMissingRoot_ThrowsInvalidGlobPattern
