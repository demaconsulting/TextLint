---
# SpellChecking Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the TextLint SpellChecking subsystem
# - The SpellChecking subsystem checks the spelling of a string of text, and of the files that the settings
#   select under a directory, and returns every finding in a deterministic order
# - Subsystem requirements decompose the system requirements for spell checking; they are validated by
#   SpellCheckingSubsystemTests.cs

sections:
  - title: TextLint Requirements
    sections:
      - title: SpellChecking Requirements
        requirements:
          - id: TextLint-SpellChecking-TextChecking
            title: >-
              The SpellChecking subsystem shall check a string of text against the dictionary of the
              configured language and the word lists, and report each unknown word, flagged word, and
              unsupported directive with its line, column, and text in text order, applying the
              word-splitting, known-word-form, minimum-length, ignored-text, and directive rules, and
              shall reject settings that cannot be used.
            justification: |
              Checking text without files is the basis of every other behavior: editors and build steps
              hold text that is not on disk, and the same rules must produce the same findings whether
              the text came from a string or a file.
            children:
              - TextLint-SpellChecking-TextChecker-UnknownWords
              - TextLint-SpellChecking-TextChecker-WordSplitting
              - TextLint-SpellChecking-TextChecker-JoinedCaseParts
              - TextLint-SpellChecking-TextChecker-KnownWordForms
              - TextLint-SpellChecking-TextChecker-MinimumWordLength
              - TextLint-SpellChecking-TextChecker-WordListPrecedence
              - TextLint-SpellChecking-TextChecker-FlaggedWords
              - TextLint-SpellChecking-TextChecker-Language
              - TextLint-SpellChecking-TextChecker-IssuePositions
              - TextLint-SpellChecking-TextChecker-IssueOrder
              - TextLint-SpellChecking-TextChecker-Directives
              - TextLint-SpellChecking-TextChecker-IgnoredText
              - TextLint-SpellChecking-TextChecker-InvalidSettings
              - TextLint-SpellChecking-TextChecker-IssueFormat
            tests:
              - SpellCheckingSubsystem_Check_UnknownWord_ReportsLineColumnAndWord
              - SpellCheckingSubsystem_Check_KnownWords_ReportsNothing
              - SpellCheckingSubsystem_Check_CamelAndSnakeCase_ReportsEachUnknownWord
              - SpellCheckingSubsystem_Check_CaseSeparatedListedWord_IsAccepted
              - SpellCheckingSubsystem_Check_ShortWord_IsNotChecked
              - SpellCheckingSubsystem_Check_PossessiveAndBackslashEscape_AreAccepted
              - SpellCheckingSubsystem_Check_WordLists_ApplyPrecedence
              - SpellCheckingSubsystem_Check_Directives_ControlChecking
              - SpellCheckingSubsystem_Check_UnsupportedDirective_IsReportedAtItsPosition
              - SpellCheckingSubsystem_Check_UrlsAndEmails_AreNotChecked
              - SpellCheckingSubsystem_Check_BritishLanguage_ChangesResult
              - SpellCheckingSubsystem_Check_CrLfAndLoneCr_CountLinesByLineFeed
              - SpellCheckingSubsystem_Check_UnusableSettings_Throw

          - id: TextLint-SpellChecking-ExcludedTextAndForms
            title: >-
              The SpellChecking subsystem shall not check text that matches the patterns of the settings or of
              the ignoreRegExp directives of the text, the
              link targets and labels of Markdown files, long tokens that look like random data, and unknown
              words inside hexadecimal sequences, shall accept contractions whose parts are acceptable, shall
              reject settings with a pattern that cannot be used, and shall report a directive pattern that
              cannot be used at its position.
            justification: |
              Projects hold text that is not prose and that the default ignore list does not recognize, and
              cspell lets them exclude it. The same rules must apply to a string and to the files of a run, and
              a pattern that cannot work must be found when the checker is created, not silently ignored.
            children:
              - TextLint-SpellChecking-TextChecker-CustomPatterns
              - TextLint-SpellChecking-TextChecker-InvalidPatterns
              - TextLint-SpellChecking-TextChecker-IgnoreRegExpDirective
              - TextLint-SpellChecking-TextChecker-MarkdownFiles
              - TextLint-SpellChecking-TextChecker-RandomStrings
              - TextLint-SpellChecking-TextChecker-Contractions
            tests:
              - SpellCheckingSubsystem_CheckText_CustomPatternsFromSettings_SkipMatches
              - SpellCheckingSubsystem_CheckText_IgnoreRegExpDirective_HidesMatchesAndReportsUnusablePatterns
              - SpellCheckingSubsystem_Constructor_UnusablePattern_ThrowsInvalidPatternException
              - SpellCheckingSubsystem_CheckAsync_MarkdownFile_SkipsLinkTargetsOfThatFileOnly
              - SpellCheckingSubsystem_CheckText_RandomLookingToken_IsSkippedUnlessSwitchedOff
              - SpellCheckingSubsystem_CheckText_Contraction_IsAcceptedWhenItsPartsAre

          - id: TextLint-SpellChecking-PatternTimeout
            title: >-
              The SpellChecking subsystem shall report a file whose check exceeds the time limit of a
              pattern as a file that took too long, an error, and shall continue with the other files.
            justification: |
              A pattern of the settings can backtrack catastrophically on a file built to make it, and
              one such file must neither hang a run nor fail the files that can be checked.
            children:
              - TextLint-SpellChecking-TextChecker-PatternTimeout
              - TextLint-SpellChecking-SpellChecker-FileDiagnostics

          - id: TextLint-SpellChecking-FileChecking
            title: >-
              The SpellChecking subsystem shall check the files that the settings select under a root
              directory and report each unknown word with its file, line, and column, shall read UTF-8
              and UTF-16 files, shall skip and report binary files and files over the size limit, shall
              report an unreadable file without stopping the run, and shall return the counts of files
              checked and skipped.
            justification: |
              Checking the files of a repository is the purpose of the product. A repository holds
              files in several encodings, binary files, and files that other programs have locked, so
              the subsystem must cope with all of them and say exactly what it did not check, so that
              nothing is silently left out.
            children:
              - TextLint-SpellChecking-SpellChecker-FileSelection
              - TextLint-SpellChecking-SpellChecker-SettingsApplied
              - TextLint-SpellChecking-SpellChecker-FileDiagnostics
              - TextLint-SpellChecking-SpellChecker-Defects
              - TextLint-SpellChecking-SpellChecker-Counts
              - TextLint-SpellChecking-SpellChecker-InvalidArguments
              - TextLint-SpellChecking-SpellChecker-ImmutableResults
              - TextLint-SpellChecking-FileTextReader-Encodings
              - TextLint-SpellChecking-FileTextReader-BinaryDetection
              - TextLint-SpellChecking-FileTextReader-SizeLimit
              - TextLint-SpellChecking-FileTextReader-ReadFailures
              - TextLint-SpellChecking-FileTextReader-InvalidArguments
            tests:
              - SpellCheckingSubsystem_CheckAsync_FilesWithUnknownWords_ReportsFileLineColumnAndWord
              - SpellCheckingSubsystem_CheckAsync_CleanFiles_ReportsNothing
              - SpellCheckingSubsystem_CheckAsync_IgnoredAndUnselectedFiles_AreNotChecked
              - SpellCheckingSubsystem_CheckAsync_Utf8Utf16AndBom_ReportSamePositions
              - SpellCheckingSubsystem_CheckAsync_BinaryFile_IsSkippedAndReported
              - SpellCheckingSubsystem_CheckAsync_FileOverMaxFileSize_IsSkippedAndReported
              - SpellCheckingSubsystem_CheckAsync_UnreadableFile_IsReportedAndRunContinues
              - SpellCheckingSubsystem_CheckAsync_MissingRoot_ThrowsDirectoryNotFoundException

          - id: TextLint-SpellChecking-FileOverrides
            title: >-
              The SpellChecking subsystem shall check each file with the settings that result from adding the
              settings of every override that selects the file's path relative to the settings root to the
              top-level settings, in the order the overrides are written, shall check a file that no override
              selects with the top-level settings, shall check every file against the language given in its
              options in preference to every language of the settings, and shall reject an override that
              cannot be applied before it touches any file.
            justification: |
              Different files need different rules: extra words for the documentation, another language for
              one folder, and a language given for one run must still win. The files must be matched by the
              path the settings were written for, whatever way the run named them, and an override that can
              never work must be found at once, not when a matching file first appears.
            children:
              - TextLint-SpellChecking-SpellChecker-Overrides
              - TextLint-SpellChecking-SpellChecker-SettingsRoot
              - TextLint-SpellChecking-SpellChecker-LanguageOption
            tests:
              - SpellCheckingSubsystem_CheckAsync_OverridesEnabledAndNotes_AppliedTogether
              - SpellCheckingSubsystem_CheckAsync_SettingsRootOption_MatchesOverridesRelativeToIt
              - SpellCheckingSubsystem_CheckAsync_LanguageOptionAndOverrideLanguage_OptionWinsWithNote

          - id: TextLint-SpellChecking-DisabledFiles
            title: >-
              The SpellChecking subsystem shall leave out of the check the selected files that the enabled
              setting switches off, at the top level or by the last override that sets it, without reading
              them or reporting anything for them, and shall count them as disabled.
            justification: |
              A project can decide that some files, or all of them for a while, are not checked. That is not a
              finding and not a failure to check, and the count lets a user confirm that the files they
              expected were switched off.
            children:
              - TextLint-SpellChecking-SpellChecker-DisabledFiles
            tests:
              - SpellCheckingSubsystem_CheckAsync_OverridesEnabledAndNotes_AppliedTogether

          - id: TextLint-SpellChecking-RunNotes
            title: >-
              The SpellChecking subsystem shall return, with the result of a run, notes that tell the caller
              when every selected file is disabled, when a language in its options replaces the language of
              an override, and when an override matches none of the selected files, each as information or a
              warning that does not make the run fail and that names the override by its position.
            justification: |
              A setting that has no effect, or an option that replaces a setting, leaves the user believing
              something that is not true. The notes let a stale override be found and an option's effect be
              seen, without failing a run whose results are correct.
            children:
              - TextLint-SpellChecking-SpellChecker-Notes
            tests:
              - SpellCheckingSubsystem_CheckAsync_OverridesEnabledAndNotes_AppliedTogether

          - id: TextLint-SpellChecking-ReportFileNames
            title: >-
              The SpellChecking subsystem shall let a caller format each finding and each file diagnostic
              of a run under a file name of the caller's choosing.
            justification: |
              A consumer that was given absolute paths must show them, while the run itself names files
              relative to its root directory; formatting under a caller-chosen name keeps the message
              wording and severity rules in the subsystem instead of copied into every consumer.
            children:
              - TextLint-SpellChecking-TextChecker-IssueFileName
              - TextLint-SpellChecking-SpellChecker-DiagnosticFileName
            tests:
              - SpellCheckingSubsystem_CheckAsync_CallerFileNames_NameIssueAndDiagnostic

          - id: TextLint-SpellChecking-ParallelDeterminism
            title: >-
              The SpellChecking subsystem shall return the same results in the same order, by file path,
              then line, then column, however many files are checked at the same time, shall let the
              caller limit that number and reject a limit below one, and shall stop and signal
              cancellation, without a partial result, when the caller cancels.
            justification: |
              Files are checked in parallel to use every processor core, but build output must be
              reproducible: a difference between two runs must mean a difference in the files, never in
              the timing. A caller must be able to leave cores free for other work, and to abandon a long
              run without being handed a partial result that looks complete.
            children:
              - TextLint-SpellChecking-SpellChecker-Parallelism
              - TextLint-SpellChecking-SpellChecker-Ordering
              - TextLint-SpellChecking-SpellChecker-Cancellation
              - TextLint-SpellChecking-TextChecker-ConcurrentUse
              - TextLint-SpellChecking-FileTextReader-ConcurrentUse
              - TextLint-SpellChecking-FileTextReader-Cancellation
            tests:
              - SpellCheckingSubsystem_CheckAsync_DifferentParallelism_ReturnsIdenticalOrderedResults
              - SpellCheckingSubsystem_CheckAsync_ConcurrentRuns_ReturnIdenticalResults
              - SpellCheckingSubsystem_Options_InvalidParallelism_ThrowsArgumentOutOfRangeException
              - SpellCheckingSubsystem_CheckAsync_CanceledToken_ThrowsOperationCanceledException
