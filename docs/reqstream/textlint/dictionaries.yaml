---
# Dictionaries Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the TextLint Dictionaries subsystem
# - The Dictionaries subsystem answers whether a word is known to the selected English language
#   and the technical vocabulary, from dictionaries embedded in the library assembly
# - Subsystem requirements decompose the system requirements for word lookup; they are validated
#   by DictionariesSubsystemTests.cs
#
# cspell:ignore colourize licence
# textlint:ignore catalogue labelled
sections:
  - title: TextLint Requirements
    sections:
      - title: Dictionaries Requirements
        requirements:
          - id: TextLint-Dictionaries-WordLookup
            title: >-
              The Dictionaries subsystem shall report a word as known when it belongs to the
              vocabulary of the selection, and as not known otherwise, whatever the text.
            justification: |
              This is the question the whole subsystem exists to answer. Text that cannot be a
              word (nothing at all, blanks, very long runs of letters) must get the answer "not
              known" rather than a failure, because a spell checker meets such text in real files.
            children:
              - TextLint-Dictionaries-SpellingDictionary-Composition
              - TextLint-Dictionaries-DictionaryImage-Lookup
            tests:
              - DictionariesSubsystem_IsKnown_ListedAndUnlistedWords_ReportsCorrectly
              - DictionariesSubsystem_IsKnown_EmptyWhitespaceAndOverlongWords_AreUnknown

          - id: TextLint-Dictionaries-WordMatching
            title: >-
              The Dictionaries subsystem shall ignore letter case, treat the typographic
              apostrophe as the straight apostrophe, keep accents significant, and report text
              outside the supported alphabet as not known.
            justification: |
              Matching must be forgiving about what authors cannot control (capitalization at
              the start of a sentence, the apostrophe a word processor inserts) and strict about
              what changes a word (a wrong accent). Text in other scripts is not English and is
              not in any dictionary, so it is not known rather than an error.
            children:
              - TextLint-Dictionaries-SpellingDictionary-WordMatching
            tests:
              - DictionariesSubsystem_IsKnown_DifferentCase_IsKnown
              - DictionariesSubsystem_IsKnown_TypographicApostrophe_IsKnown
              - DictionariesSubsystem_IsKnown_AccentedAndUnaccentedSpelling_BothKnown
              - DictionariesSubsystem_IsKnown_OtherScript_IsUnknown

          - id: TextLint-Dictionaries-LanguageSelection
            title: >-
              The Dictionaries subsystem shall select its English vocabulary by language name
              (en, en-US, en-GB, or a combination), with American English as the default, and
              shall reject any other language by name.
            justification: |
              The language setting decides which spellings are correct. Following cspell's names
              and default lets configurations migrate, and an unsupported name must be refused so
              that a typo cannot silently select the wrong dialect.
            children:
              - TextLint-Dictionaries-SpellingDictionary-LanguageSelection
            tests:
              - DictionariesSubsystem_ForLanguages_AmericanBritishAndBoth_SelectExpectedSpellings
              - DictionariesSubsystem_ForLanguages_UnsupportedLanguage_ThrowsNamingLanguage

          - id: TextLint-Dictionaries-TechnicalTerms
            title: The Dictionaries subsystem shall include the technical terms in every selection.
            justification: |
              Software terms do not depend on the dialect of the prose around them, and leaving
              them out of any selection would report them as mistakes.
            children:
              - TextLint-Dictionaries-SpellingDictionary-TechnicalTerms
            tests:
              - DictionariesSubsystem_IsKnown_TechnicalTermInEveryLanguage_IsKnown

          - id: TextLint-Dictionaries-SharedUse
            title: >-
              The Dictionaries subsystem shall be safe for use from many threads at once and shall
              share one selection between all callers that ask for it.
            justification: |
              Files are checked in parallel, so every thread uses the same dictionaries. Sharing
              the selection means the data is loaded once for the whole process, and thread safety
              means callers need no locking of their own.
            children:
              - TextLint-Dictionaries-SpellingDictionary-SharedInstances
            tests:
              - DictionariesSubsystem_ForLanguages_SameSelection_ReturnsSameInstance
              - DictionariesSubsystem_IsKnown_ParallelCallers_ReturnConsistentAnswers

          - id: TextLint-Dictionaries-ShippedData
            title: >-
              The Dictionaries subsystem shall draw all of its vocabulary (common English, American,
              British, and technical) from data that ships with the library, and shall report data
              that is missing or unusable with an error that names it.
            justification: |
              A lookup that depended on files found at run time would fail wherever they are not
              found. Each part of the vocabulary must be present for the selections that need it,
              and missing or unusable data means the library was built or packaged incorrectly, so
              the person who must fix it needs to know which data it is.
            children:
              - TextLint-Dictionaries-DictionaryImage-LoadShippedData
            tests:
              - DictionariesSubsystem_ForLanguages_ShippedVocabulary_ContainsSampleWordsOfEachPart

          - id: TextLint-Dictionaries-DerivedForms
            title: >-
              The Dictionaries subsystem shall know the inflected and derived forms of its English words
              (for example "testability" and "reviewable") in every selection, and shall know a spelling
              that is specific to British or American English only in the selection of that language.
            justification: |
              Technical writing is full of regular derivations that a base word list lacks, and reporting
              them as mistakes would bury real findings. The language setting must still decide regional
              spellings such as "catalogue" and "labelled", so the derived forms must not let a spelling of
              the other dialect through.
            tests:
              - DictionariesSubsystem_IsKnown_DerivedForms_AreKnownInEveryLanguage
              - DictionariesSubsystem_ForLanguages_BritishOnlySpellings_AreKnownOnlyForBritish

          - id: TextLint-Dictionaries-RegionalSeparation
            title: >-
              The Dictionaries subsystem shall keep the American and the British spelling of a word apart
              whatever the letter case of the form that is looked up, and shall not know an -ize form in
              British English when the -ise form is the British spelling.
            justification: |
              Lookups ignore letter case, so a capitalized form of a word (such as a name) must not let the
              spelling of one dialect into the other. British English is -ise only, so a hybrid such as
              "colourize" is a mistake in both dialects. Spelling checks do not know the part of speech, so
              a word whose British form differs only by part of speech (license and licence) is accepted in
              both forms by British English; that is inherent in the check and is not a leak.
            tests:
              - DictionariesSubsystem_ForLanguages_CapitalizedAndIzeForms_DoNotCrossRegions

          - id: TextLint-Dictionaries-ExcludedWords
            title: >-
              The Dictionaries subsystem shall not know the words of the reviewed exclusions list in any
              selection, while still knowing the accepted variants that are not on it.
            justification: |
              A misspelling that an imported list contains must be reported as unknown, whichever
              dictionary the list belongs to, and a valid variant spelling that merely looks like a typo
              must not be reported because of it.
            tests:
              - DictionariesSubsystem_IsKnown_ExcludedWords_AreUnknownInEveryLanguage
