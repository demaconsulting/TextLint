---
# Software Unit Requirements for the TextLintSettings Class
#
# The TextLintSettings class is the immutable settings value that carries the version, include
# patterns, ignore patterns, hidden-file switch, and the spelling settings (language, word lists,
# minimum word length, and maximum file size), whether loaded from a file or built in code.

sections:
  - title: TextLint Requirements
    sections:
      - title: Configuration Requirements
        sections:
          - title: TextLintSettings Requirements
            requirements:
              - id: TextLint-Configuration-TextLintSettings-Defaults
                title: >-
                  TextLintSettings shall default to no version, no include patterns, no ignore
                  patterns, and hidden-file matching disabled.
                justification: |
                  A project that configures nothing must get safe, predictable behavior: no files
                  are selected until the user asks for some, and hidden files are not reached by
                  wildcards, matching cspell.
                tests:
                  - TextLintSettings_New_NoValues_HasDocumentedDefaults

              - id: TextLint-Configuration-TextLintSettings-SpellingDefaults
                title: >-
                  TextLintSettings shall default the language to en, the minimum word length to
                  4, the word lists to empty, and the maximum file size to no limit.
                justification: |
                  These are cspell's defaults, so a project that configures no spelling setting
                  behaves as a cspell user expects: American English, short words left alone, no
                  words of its own, and every file checked whatever its size.
                tests:
                  - TextLintSettings_New_NoValues_HasSpellingDefaults

              - id: TextLint-Configuration-TextLintSettings-ListsImmutable
                title: >-
                  TextLintSettings shall hold copies of the words, ignored words, and flagged words
                  lists, so that neither a later change to a supplied list nor a change through the
                  exposed list alters the settings, and shall reject a missing list.
                justification: |
                  Settings are shared across the whole run, including concurrent work, so no holder
                  may be able to alter the words another holder sees. A null list is a programming
                  error that must surface where it is made.
                tests:
                  - TextLintSettings_With_ChangedSpellingValues_LeavesOriginalUnchanged
                  - TextLintSettings_Init_WordsMutatedAfterAssignment_DoesNotAffectSettings
                  - TextLintSettings_Init_IgnoreWordsMutatedAfterAssignment_DoesNotAffectSettings
                  - TextLintSettings_Init_FlagWordsArrayMutatedAfterAssignment_DoesNotAffectSettings
                  - TextLintSettings_Init_NullWords_ThrowsArgumentNullException
                  - TextLintSettings_Init_NullIgnoreWords_ThrowsArgumentNullException
                  - TextLintSettings_Init_NullFlagWords_ThrowsArgumentNullException
                  - TextLintSettings_WordLists_ExposedLists_CannotBeMutatedThroughInterface

              - id: TextLint-Configuration-TextLintSettings-ValueValidation
                title: >-
                  TextLintSettings shall reject a missing language, a minimum word length below 1,
                  a minimum random length below 1, and a negative maximum file size when they are
                  assigned, and shall accept a minimum word length of 1, a minimum random length
                  of 1, and a maximum file size of 0.
                justification: |
                  A value outside these ranges can never be meaningful: no word is shorter than one
                  character, and a size cannot be negative. Refusing it where it is assigned names
                  the cause at once, while the boundary values stay valid, 0 meaning no size limit.
                tests:
                  - TextLintSettings_Init_NullLanguage_ThrowsArgumentNullException
                  - TextLintSettings_Init_UnsupportedLanguage_IsAcceptedWithoutValidation
                  - TextLintSettings_Init_MinWordLengthZero_ThrowsArgumentOutOfRangeException
                  - TextLintSettings_Init_MinWordLengthNegative_ThrowsArgumentOutOfRangeException
                  - TextLintSettings_Init_MinWordLengthOne_IsAccepted
                  - TextLintSettings_Init_MaxFileSizeNegative_ThrowsArgumentOutOfRangeException
                  - TextLintSettings_Init_MaxFileSizeZeroAndLargest_AreAccepted
                  - TextLintSettings_Init_MinRandomLength_IsValidatedAtOne

              - id: TextLint-Configuration-TextLintSettings-PatternDefaults
                title: >-
                  TextLintSettings shall default to no ignoreRegExpList entries, no patterns, random
                  strings ignored, and a minimum random length of 40, as cspell does.
                justification: |
                  A project without these keys must see the behavior of cspell without them, so the
                  defaults are the cspell defaults and not an empty or disabled state.
                tests:
                  - TextLintSettings_New_NoValues_HasDocumentedPatternDefaults

              - id: TextLint-Configuration-TextLintSettings-Immutable
                title: >-
                  TextLintSettings shall be immutable: a copy shall not change the original, a
                  later change to a supplied list shall not change the settings, and a missing
                  list shall be rejected.
                justification: |
                  Settings are shared across the whole run, including concurrent work, so no
                  holder may be able to alter what another holder sees. A null list is a
                  programming error that must surface where it is made.
                tests:
                  - TextLintSettings_With_ChangedFiles_LeavesOriginalUnchanged
                  - TextLintSettings_Init_ListMutatedAfterAssignment_DoesNotAffectSettings
                  - TextLintSettings_Init_IgnorePathsMutatedAfterAssignment_DoesNotAffectSettings
                  - TextLintSettings_Init_ArrayMutatedAfterAssignment_DoesNotAffectSettings
                  - TextLintSettings_Init_NullFiles_ThrowsArgumentNullException
                  - TextLintSettings_Init_NullIgnorePaths_ThrowsArgumentNullException
                  - TextLintSettings_Files_ExposedList_CannotBeMutatedThroughInterface
                  - TextLintSettings_Init_PatternLists_AreCopied
                  - TextLintSettings_Init_NullPatternListOrEntry_ThrowsArgumentNullException
                  - TextLintSettings_With_PatternSettings_AreCopiedAndIndependent
