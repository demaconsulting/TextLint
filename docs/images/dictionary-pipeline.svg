    <rect x="200" y="20" width="160" height="326" rx="14" fill="#f8fafc" stroke="#7c3aed" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="214" y="40" font-size="13" font-weight="600" fill="#7c3aed">dictionaries/ (text)</text>
    <g fill="#ede9fe" stroke="#7c3aed" stroke-width="2">
