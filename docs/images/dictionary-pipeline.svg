<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="14" y="16" width="875" height="391" rx="28" fill="#d5dce6"/>
  <rect x="10" y="10" width="875" height="391" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <g transform="translate(30,30)">
    <text x="85" y="40" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">Sources</text>
    <g fill="#f1f5f9" stroke="#64748b" stroke-width="2">
      <rect x="0" y="56" width="170" height="56" rx="6"/>
      <rect x="0" y="128" width="170" height="56" rx="6"/>
      <rect x="0" y="200" width="170" height="56" rx="6"/>
      <rect x="0" y="272" width="170" height="56" rx="6"/>
    </g>
    <g text-anchor="middle">
      <g font-size="14" font-weight="600" fill="#334155">
        <text x="85" y="80">SCOWL</text>
        <text x="85" y="152">SCOWL Hunspell</text>
        <text x="85" y="224">cspell-dicts</text>
        <text x="85" y="296">Project-owned</text>
      </g>
      <g font-size="11" fill="#475569">
        <text x="85" y="98">size 70 word lists</text>
        <text x="85" y="170">expanded by word_forms.py</text>
        <text x="85" y="242">English and technical lists</text>
