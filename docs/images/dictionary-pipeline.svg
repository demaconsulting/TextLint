    <rect x="590" y="20" width="250" height="326" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
    <text x="604" y="40" font-size="13" font-weight="600" fill="#2563eb">TextLint library (run time)</text>
    <rect x="604" y="56" width="222" height="158" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="715" y="78" font-size="13" font-weight="600" fill="#4c1d95" text-anchor="middle">Embedded dictionaries</text>
    <g font-size="12" fill="#5b21b6" text-anchor="middle">
      <rect x="620" y="90" width="190" height="24" rx="5" fill="#ffffff" stroke="#7c3aed"/>
      <text x="715" y="107">common</text>
      <rect x="620" y="118" width="190" height="24" rx="5" fill="#ffffff" stroke="#7c3aed"/>
      <text x="715" y="135">American</text>
      <rect x="620" y="146" width="190" height="24" rx="5" fill="#ffffff" stroke="#7c3aed"/>
      <text x="715" y="163">British</text>
      <rect x="620" y="174" width="190" height="24" rx="5" fill="#ffffff" stroke="#7c3aed"/>
      <text x="715" y="191">technical</text>
    </g>
    <line x1="715" y1="216" x2="715" y2="240" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <rect x="604" y="244" width="222" height="84" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="715" y="268" font-size="14" font-weight="600" fill="#166534" text-anchor="middle">SpellingDictionary</text>
    <g font-size="11" fill="#166534" text-anchor="middle">
      <text x="715" y="288">Selects by language: en-US,</text>
      <text x="715" y="302">en-GB, or both, always with</text>
      <text x="715" y="316">common and technical</text>
    </g>
    <path d="M546,300 L575,300 L575,135 L602,135" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  </g>
</svg>
