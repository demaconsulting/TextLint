      <rect x="214" y="112" width="132" height="48" rx="8"/>
      <rect x="214" y="168" width="132" height="48" rx="8"/>
      <rect x="214" y="224" width="132" height="48" rx="8"/>
      <rect x="214" y="280" width="132" height="48" rx="8"/>
    </g>
    <g text-anchor="middle">
      <g font-size="13" font-weight="600" fill="#4c1d95">
        <text x="280" y="76">en-common</text>
        <text x="280" y="132">en-US</text>
        <text x="280" y="188">en-GB</text>
        <text x="280" y="244">technical</text>
        <text x="280" y="300">exclusions.txt</text>
      </g>
      <g font-size="11" fill="#5b21b6">
        <text x="280" y="93">spelled the same</text>
        <text x="280" y="149">American only</text>
        <text x="280" y="205">British (-ise) only</text>
        <text x="280" y="261">languages and tools</text>
        <text x="280" y="317">never-known words</text>
      </g>
    </g>
    <line x1="364" y1="184" x2="386" y2="184" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

