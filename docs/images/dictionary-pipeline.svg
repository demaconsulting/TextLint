      <rect x="404" y="200" width="142" height="56" rx="8"/>
      <rect x="404" y="272" width="142" height="56" rx="8"/>
    </g>
    <g text-anchor="middle">
      <g font-size="13" font-weight="600" fill="#1e3a8a">
        <text x="475" y="80">WordListReader</text>
        <text x="475" y="152">VariantFilter</text>
        <text x="475" y="224">ExclusionFilter</text>
        <text x="475" y="296">DictionaryWriter</text>
      </g>
      <g font-size="11" fill="#1e40af">
        <text x="475" y="98">reads and validates</text>
        <text x="475" y="170">merges technical lists</text>
        <text x="475" y="242">removes excluded words</text>
        <text x="475" y="314">writes each .tld file</text>
