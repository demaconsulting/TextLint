---
# Spell-Checking
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: "0.2"
language: en

# Project-specific technical terms and tool names
words:
  - Blockquotes
  - Postconditions
  - buildmark
  - canvasnet
  - buildtransitive
  - contentfiles
  - dcterms
  - DEMA
  - Dema
  - demaconsulting
  - doctitle
  - filesystemglobbing
  - docversion
  - errorlevel
  - fileassert
  - finalizer
  - xunit
  - nameof
  - pagetitle
  - Pandoc
  - Qube
  - reqstream
  - reviewmark
  - SARIF
  - sarifmark
  - setlocal
  - snupkg
  - sonarmark
  - sysml
  - sysml2tools
  - textlint
  - trimmable
  - venv
  - versionmark
  - Weasyprint
  - yamlfix
  - yamldotnet

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - "**/.git/**"
  - "**/node_modules/**"
  - "**/.venv/**"
  - "**/thirdparty/**"
  - "**/third-party/**"
  - "**/3rd-party/**"
  - "**/generated/**"
  - "**/AGENT_REPORT_*.md"
  - "**/.agent-logs/**"
  - "**/bin/**"
  - "**/obj/**"
  - package-lock.json
  # Word lists: hundreds of thousands of generated entries (the technical lists include
  # intentionally non-English terms), checked by the dictionary builder instead of spell-checking.
  - "dictionaries/**/*.txt"
